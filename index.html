<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grove">
<meta name="theme-color" id="themeColor" content="#d6eeff" media="(prefers-color-scheme: light)">
<meta name="theme-color" id="themeColorDark" content="#141a36" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Grove</title>
<style>
/* ==========================================================================
   Grove — a sunny morning sky by day, a starry one by night, and the colour
   of the tree you are growing as the only accent.
   ========================================================================== */
@font-face{
  font-family:'Fraunces';font-style:normal;font-weight:400 700;font-display:swap;
  src:url('fonts/fraunces-latin.woff2') format('woff2');
}
@font-face{
  font-family:'Karla';font-style:normal;font-weight:400 700;font-display:swap;
  src:url('fonts/karla-latin.woff2') format('woff2');
}

:root{
  --sky:#d6eeff;
  --paper:#fff6e8;
  --card:#ffffff;
  --well:#f5ead6;
  --line:#efe1c9;
  --ink:#3b2f26;
  --ink-2:#6f6053;
  --ink-3:#a5968a;
  --coin:#f0a417;
  --bad:#e0695b;
  --msky1:#c9e8ff; --msky2:#fff3dd;
  --shadow:0 1px 0 rgba(120,80,30,.05), 0 10px 24px -14px rgba(120,80,30,.45);
  --sub:#4c9a43;
  --r:18px;
  --fd:'Fraunces', Georgia, 'Times New Roman', serif;
  --fs:'Karla', ui-sans-serif, system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#141a36; --paper:#231f3d; --card:#2c2a4b; --well:#1e1c37; --line:#3a3861;
    --ink:#f6f0e8; --ink-2:#c8c0d4; --ink-3:#9089a9;
    --coin:#ffc24a; --bad:#ff8b7b;
    --msky1:#1a2150; --msky2:#2e2a57;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --sky:#141a36; --paper:#231f3d; --card:#2c2a4b; --well:#1e1c37; --line:#3a3861;
  --ink:#f6f0e8; --ink-2:#c8c0d4; --ink-3:#9089a9;
  --coin:#ffc24a; --bad:#ff8b7b;
  --msky1:#1a2150; --msky2:#2e2a57;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.75);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{background-color:#d6eeff}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){background-color:#141a36}}
html[data-theme="dark"]{background-color:#141a36}
html[data-theme="light"]{background-color:#d6eeff}
body{
  background-color:var(--paper);
  background-image:linear-gradient(180deg, var(--sky) 0, var(--paper) 58%);
  min-height:100dvh;
  color:var(--ink);
  font-family:var(--fs);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
}
/* the sun (or the moon) and two clouds (or a few stars), behind everything */
body::before{content:'';position:fixed;top:-70px;right:-60px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,205,90,.55) 0, rgba(255,205,90,.18) 42%, rgba(255,205,90,0) 70%);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:92px;left:-24px;width:84px;height:26px;border-radius:999px;
  background:rgba(255,255,255,.75);pointer-events:none;z-index:0;
  box-shadow:26px -12px 0 3px rgba(255,255,255,.75), 52px 0 0 0 rgba(255,255,255,.75),
    calc(100vw - 70px) 58px 0 -3px rgba(255,255,255,.6), calc(100vw - 46px) 48px 0 1px rgba(255,255,255,.6)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body::before{background:radial-gradient(circle, rgba(220,220,255,.22) 0, rgba(220,220,255,.07) 42%, rgba(220,220,255,0) 70%)}
  :root:not([data-theme="light"]) body::after{top:40px;left:0;width:2px;height:2px;background:rgba(255,255,255,.8);
    box-shadow:14vw 6vh 0 0 rgba(255,255,255,.7), 31vw 13vh 0 .5px rgba(255,255,255,.55), 47vw 4vh 0 0 rgba(255,255,255,.75),
      62vw 16vh 0 0 rgba(255,255,255,.5), 78vw 9vh 0 .5px rgba(255,255,255,.7), 88vw 21vh 0 0 rgba(255,255,255,.45),
      8vw 22vh 0 0 rgba(255,255,255,.45), 24vw 28vh 0 0 rgba(255,255,255,.35), 70vw 30vh 0 0 rgba(255,255,255,.35)}
}
:root[data-theme="dark"] body::before{background:radial-gradient(circle, rgba(220,220,255,.22) 0, rgba(220,220,255,.07) 42%, rgba(220,220,255,0) 70%)}
:root[data-theme="dark"] body::after{top:40px;left:0;width:2px;height:2px;background:rgba(255,255,255,.8);
  box-shadow:14vw 6vh 0 0 rgba(255,255,255,.7), 31vw 13vh 0 .5px rgba(255,255,255,.55), 47vw 4vh 0 0 rgba(255,255,255,.75),
    62vw 16vh 0 0 rgba(255,255,255,.5), 78vw 9vh 0 .5px rgba(255,255,255,.7), 88vw 21vh 0 0 rgba(255,255,255,.45),
    8vw 22vh 0 0 rgba(255,255,255,.45), 24vw 28vh 0 0 rgba(255,255,255,.35), 70vw 30vh 0 0 rgba(255,255,255,.35)}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sub);outline-offset:3px;border-radius:6px}

#app{
  position:relative;z-index:1;
  display:flex;flex-direction:column;height:100dvh;
  max-width:520px;margin:0 auto;padding-inline:20px;
  padding-top:calc(env(safe-area-inset-top) + 10px);
  padding-bottom:calc(env(safe-area-inset-bottom) + 10px);
}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.view{display:none;flex:1;flex-direction:column;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  /* room for the coloured button shadows, which a scrolling box would clip */
  padding:0 10px 18px;margin:0 -10px}
.view.on{display:flex}

/* ---------------- motion ----------------
   Nothing here snaps: what leaves fades out, what arrives fades in, and a
   button stays pressed while the step is on its way. The tab bar is the one
   deliberate exception — a tab is a place you switch to, not a step you take.
   --mx/--my say where a block leaves towards, --nx/--ny where it comes from. */
.leaving{opacity:0;pointer-events:none;
  transform:translate(var(--mx,0px), var(--my,-4px));
  transition:opacity .13s ease-in, transform .13s ease-in}
.entering{animation:arrive .26s cubic-bezier(.22,.9,.3,1)}
@keyframes arrive{from{opacity:0;transform:translate(var(--nx,0px), var(--ny,7px))}
  to{opacity:1;transform:none}}
.held{transform:translateY(1px) scale(.985);opacity:.82;transition:transform .1s, opacity .1s}
.bump{animation:bump .24s ease-out}
@keyframes bump{from{opacity:.2;transform:scale(.95)}to{opacity:1;transform:none}}
.pop{animation:pop .7s cubic-bezier(.3,1.7,.45,1)}
@keyframes pop{0%{transform:scale(.86)}100%{transform:none}}

/* ---------------- top bar ---------------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;min-height:38px}
.coins{display:flex;align-items:center;gap:7px;padding:6px 13px 6px 8px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
  font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.coins svg{width:18px;height:18px;flex:none}
.icobtn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.icobtn svg{width:19px;height:19px}
.title{font-family:var(--fd);font-size:20px;font-weight:600;
  font-variation-settings:'SOFT' 100,'WONK' 1;letter-spacing:-.01em}

/* ---------------- dial ---------------- */
.dialwrap{position:relative;width:100%;max-width:330px;margin:auto auto 0;aspect-ratio:1;flex:none;touch-action:none}
.dialwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dialwrap canvas{position:absolute;left:11.5%;top:11.5%;width:77%;height:77%;display:block}
.disc{fill:var(--card);opacity:.55}
.track{fill:none;stroke:var(--well);stroke-width:14;stroke-linecap:round}
.arc{fill:none;stroke:var(--sub);stroke-width:14;stroke-linecap:round}
.handle{fill:var(--card);stroke:var(--sub);stroke-width:4}
.handle-dot{fill:var(--sub)}

.readout{text-align:center;margin:4px 0 auto}
.minutes{font-family:var(--fd);font-size:48px;font-weight:600;line-height:1;
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 90;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.minutes small{font-family:var(--fs);font-size:14px;font-weight:500;color:var(--ink-3);margin-left:6px}
.minutes small.tight{margin-left:1px}   /* the m of "1h 45m" hangs on the number */
.treebtn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 15px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
  font-size:14px;font-weight:700}
.treebtn .chev{color:var(--ink-3);font-size:11px}
.growline{margin-top:10px;font-size:13px;color:var(--ink-3)}
.growline b{color:var(--sub);font-weight:700}
.stagename{margin-top:3px;font-size:12.5px;color:var(--ink-3)}
.stagename b{color:var(--ink-2);font-weight:700}

.plant{width:100%;margin-top:14px;padding:18px;border-radius:999px;
  background:var(--sub);color:#fff;font-size:17px;font-weight:700;letter-spacing:.01em;
  box-shadow:0 10px 20px -12px var(--sub), inset 0 -3px 0 rgba(0,0,0,.12)}
.plant:active{transform:translateY(1px)}

/* ---------------- session ---------------- */
.session-top{display:flex;justify-content:center;padding-block:6px 0;margin-bottom:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.clock{font-family:var(--fd);font-size:clamp(50px,17vw,72px);font-weight:600;line-height:1;
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 120;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;text-align:center;margin-top:8px}
.substate{text-align:center;margin:10px 0 auto;font-size:13px;color:var(--ink-3)}
.substate b{color:var(--sub);font-weight:700}
.hold{position:relative;overflow:hidden;width:100%;padding:16px;
  border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:13px;color:var(--ink-3);text-align:center}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink-3);opacity:.2}
.hold.finish{background:var(--sub);border-color:var(--sub);color:#fff;font-weight:700}
.dialwrap.over .track{stroke:var(--sub);opacity:.28}
.dialwrap.over .arc{stroke:var(--sub)}
.dialwrap.paused .arc{stroke:var(--ink-3)}
.dialwrap.paused canvas{opacity:.45}
.hold span{position:relative}

.flash{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);
  z-index:60;padding:11px 16px;border-radius:999px;background:var(--bad);color:#fff;
  font-size:13px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .25s;max-width:88vw;text-align:center}
.flash.on{opacity:1}

/* ---------------- outcome ---------------- */
.result{text-align:center}
.result h2{font-family:var(--fd);font-size:29px;font-weight:600;
  font-variation-settings:'SOFT' 100,'WONK' 1;margin:0 0 6px;letter-spacing:-.02em}
.result p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.gain{display:flex;justify-content:center;gap:8px;margin:16px 0 10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;
  font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.pill svg{width:14px;height:14px}
.note{font-size:13px!important;color:var(--ink-3)!important}
.again{width:100%;margin-top:22px;padding:17px;border-radius:999px;
  background:var(--sub);color:#fff;font-size:16px;font-weight:700;
  box-shadow:0 10px 20px -12px var(--sub)}

/* ---------------- stats ---------------- */
.scope{display:flex;gap:3px;padding:4px;background:var(--well);border-radius:999px;margin-bottom:14px}
.scope button{flex:1;padding:8px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-3)}
.scope button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.period{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.period .label{font-size:14px;font-weight:700}
.period button{width:34px;height:34px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);color:var(--ink-2)}
.period button:disabled{opacity:.35}
.hero{display:flex;align-items:baseline;gap:10px}
.hero .v{font-family:var(--fd);font-size:48px;font-weight:600;line-height:1;
  font-variation-settings:'SOFT' 100,'WONK' 1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .u{font-size:13.5px;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;box-shadow:var(--shadow)}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .k{font-size:11px;color:var(--ink-3);margin-top:2px}
.chart .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.chart .cap .t{font-size:13px;font-weight:700}
.chart .cap .m{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line)}
.bars button{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end}
.bars i{display:block;width:100%;background:var(--sub);border-radius:5px 5px 0 0}
.bars i.zero{background:var(--line);height:2px!important;border-radius:2px}
.bars button[aria-pressed="true"] i{outline:2px solid var(--ink);outline-offset:1px}
.axis{display:flex;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--ink-3)}
.readbox{margin-top:12px;padding:10px 13px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px}
.readbox b{color:var(--ink);font-variant-numeric:tabular-nums}
.slist{margin-top:26px}
.slist h3{font-size:13px;font-weight:700;margin:0 0 12px}
.dotc{width:10px;height:10px;border-radius:999px;flex:none;display:inline-block}
.sess{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.sess .when{font-size:12px;color:var(--ink-3);width:44px;flex:none;font-variant-numeric:tabular-nums}
.sess .nm{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .len{font-size:13px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.sess.ko .len{color:var(--ink-3)}
.sess .tag{font-size:11px;color:var(--ink-3);flex:none}
.foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3);text-align:center}

/* ---------------- forest ---------------- */
.meadow{position:relative;margin:16px 0 22px;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg, var(--msky1), var(--msky2));
  border:1px solid var(--line);box-shadow:var(--shadow)}
.meadow canvas{display:block;width:100%;aspect-ratio:1/.8}
.mempty{position:absolute;left:0;right:0;top:20%;text-align:center;padding:0 24px;
  font-size:13.5px;line-height:1.6;color:var(--ink-2);font-weight:600}
.more{position:absolute;right:12px;bottom:10px;font-size:11px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.25);padding:3px 9px;border-radius:999px}
.gsec{font-size:11.5px;font-weight:700;color:var(--ink-3);margin:0 0 10px;
  letter-spacing:.05em;text-transform:uppercase}
.spcard{display:flex;width:100%;gap:12px;align-items:center;text-align:left;margin-bottom:9px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:8px 14px 8px 10px;box-shadow:var(--shadow)}
.spcard canvas{width:60px;height:60px;flex:none}
.spcard .body{flex:1;min-width:0;display:block}
.spcard .n{display:block;font-size:14px;font-weight:700;line-height:1.25}
.spcard .c{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}
.spcard .x{font-family:var(--fd);font-size:24px;font-weight:600;color:var(--sub);
  font-variation-settings:'SOFT' 100,'WONK' 1;font-variant-numeric:tabular-nums}
.empty{color:var(--ink-3);font-size:13.5px;text-align:center;padding:40px 20px;line-height:1.7}

/* ---------------- nav ---------------- */
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:0;padding:4px;
  background:var(--well);border-radius:999px}
nav button{padding:10px 2px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
nav button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* ---------------- sheet ---------------- */
/* the backdrop deliberately starts below the status bar: iOS paints that strip
   itself and keeps whatever colour is composited over it */
.backdrop{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top);
  background:rgba(40,30,20,.38);z-index:50;opacity:0;visibility:hidden;
  pointer-events:none;transition:opacity .22s, visibility 0s .22s}
.backdrop.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .22s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88dvh;overflow-y:auto;
  background:var(--paper);border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  padding:8px 20px calc(env(safe-area-inset-bottom) + 24px);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  max-width:520px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sheet.on{transform:translateY(0)}
.sheethead{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;
  padding:4px 0 8px;background:var(--paper)}
.sheetx{width:34px;height:34px;border-radius:999px;background:var(--well);color:var(--ink-2);
  display:grid;place-items:center;font-size:15px;line-height:1}
.sheetx:active{background:var(--line)}
.sheet h2{font-family:var(--fd);font-size:22px;font-weight:600;
  font-variation-settings:'SOFT' 100,'WONK' 1;margin:0 0 4px}
.sheet .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 18px;line-height:1.55}
.subjhead{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:11.5px;
  font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.spgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sp{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:8px 8px 11px;text-align:center;box-shadow:var(--shadow)}
.sp[aria-pressed="true"]{border-color:var(--sel, var(--sub));box-shadow:0 0 0 2px var(--sel, var(--sub))}
.sp canvas{width:100%;aspect-ratio:1;display:block}
.sp .dice{width:100%;aspect-ratio:1;display:grid;place-items:center;font-size:62px;line-height:1}
.sp .n{font-size:13px;font-weight:700;line-height:1.25;margin-top:4px}
.sp .t{font-size:11px;color:var(--ink-3);margin-top:2px}
.sp.locked canvas{opacity:.35;filter:grayscale(.85)}
.sp .cost{display:inline-flex;align-items:center;gap:4px;margin-top:4px;
  font-size:12px;font-weight:700;color:var(--coin)}
.sp .cost svg{width:12px;height:12px}
.sp.cant .cost{color:var(--ink-3)}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow .k{font-size:14px;font-weight:700}
.setrow .d{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.setrow .ctl{flex:none}
.mini{padding:8px 13px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:12.5px;font-weight:700}
.mini.danger{color:var(--bad);border-color:var(--bad)}

<script>
"use strict";
/* =========================================================================
   Grove — focus timer. Pick a tree, and it grows from a seed while you stay
   on the timer; when the time is up it is planted in your forest. No
   dependencies, no network: everything lives in localStorage.

   Time is always derived from Date.now(): iOS freezes JS in the background,
   so any incremental counter would be wrong.
   ========================================================================= */

const BUILD = 19;                            /* bump with sw.js CACHE */
const STORE = 'epflfocus.v3';                /* the key predates the rename: keep it, it holds the history */
const COIN_PER_MIN = 1;
const MIN_MINUTES = 5;
const STEP_MINUTES = 5;                     /* the drag is smooth, the value moves in 5s */
const MAX_MINUTES = 120;
const OVERTIME_MAX = 60*60000;              /* extra time a session can run on for */
const SESSION_CAP  = 120*60000;             /* planned + overtime never goes past this */
const POM = {block:25*60000, short:5*60000, long:15*60000, every:4};
const MEADOW_MAX = 150;                     /* more than this and the trees get too small to read */

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY3 = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];   /* weeks start on Monday */

/* ========================================================== DRAWING MODEL
   A tree is a builder that emits primitives tagged with the stage they belong
   to, on a 1000×1000 canvas with the foot of the trunk at (500, 900). During
   a session the stages fill in one after the other, from seed to full tree.
     gnd  — the grass mound: always there, left out when planted in the forest
     un   — scaffolding (seed, sprout, sapling) that fades out during the stage
            after `un`, while the real thing grows over it
     q    — when the item appears within its stage, 0…1; items that share a q
            appear together, which keeps an outlined crown one clean shape
     o    — the point a polygon grows out of (default: its centre)
   ========================================================================= */
function emitter(){
  const items = [], names = [];
  let cur = -1;
  const push = o => { o.st = cur; items.push(o); return o; };
  const A = {
    stage(name){ cur++; names.push(name); },
    line(x1,y1,x2,y2,o){ return push(Object.assign({k:'line',x1,y1,x2,y2}, o)); },
    path(pts,o){ return push(Object.assign({k:'path',pts}, o)); },
    curve(x1,y1,cx,cy,x2,y2,o){ return push(Object.assign({k:'curve',x1,y1,cx,cy,x2,y2}, o)); },
    poly(pts,o){ return push(Object.assign({k:'poly',pts}, o)); },
    dot(x,y,r,o){ return push(Object.assign({k:'dot',x,y,r}, o)); },
    ell(x,y,rx,ry,rot,o){ return push(Object.assign({k:'ell',x,y,rx,ry,rot:rot||0}, o)); },
  };
  return {A, items, names};
}

/* --- shared pieces -------------------------------------------------------- */
function prelude(A){
  A.stage('Seed');
  A.ell(500, 908, 250, 40, 0, {f:'grass', c:'grassd', w:4, gnd:1});
  A.ell(430, 895, 95, 12, -0.04, {f:'grassl', c:null, w:0, gnd:1, op:.75});
  A.ell(500, 898, 54, 11, 0, {f:'soil', c:null, w:0, gnd:1});
  A.ell(500, 884, 17, 23, 0.35, {f:'seed', c:'barkd', w:3, un:0});

  A.stage('Sprout');
  A.curve(500, 898, 492, 855, 503, 812, {c:'sproutd', w:8, un:1});
  A.ell(470, 812, 32, 15, -0.45, {f:'sprout', c:'sproutd', w:3, un:1});
  A.ell(534, 804, 32, 15, 0.45, {f:'sprout', c:'sproutd', w:3, un:1});

  A.stage('Sapling');
  A.line(500, 898, 500, 660, {c:'sproutd', w:11, un:2});
  [[462,770,-.5],[538,745,.5],[464,705,-.5],[536,682,.5]].forEach(([x,y,r]) =>
    A.ell(x, y, 38, 17, r, {f:'sprout', c:'sproutd', w:3, un:2}));
  A.ell(500, 640, 20, 36, 0, {f:'sprout', c:'sproutd', w:3, un:2});
}
function trunk(A, pts, o){
  A.poly(pts, Object.assign({f:'bark', c:'barkd', w:4, o:[500,900]}, o));
}
/* all the dark undersides first, then the bark: crossings stay clean */
function limbs(A, list){
  const n = list.length;
  list.forEach(([x1,y1,cx,cy,x2,y2,w], i) => A.curve(x1,y1,cx,cy,x2,y2, {c:'barkd', w:w+8, q:i/n}));
  list.forEach(([x1,y1,cx,cy,x2,y2,w], i) => A.curve(x1,y1,cx,cy,x2,y2, {c:'bark', w, q:i/n}));
}
/* a crown made of overlapping blobs that reads as one outlined shape */
function cloud(A, blobs, o){
  o = o || {};
  const n = blobs.length;
  const fk = i => Array.isArray(o.f) ? o.f[i % o.f.length] : (o.f || 'leaf');
  const top = Math.min(...blobs.map(b => b[1] - b[3]));
  blobs.forEach(([x,y,rx,ry], i) => A.ell(x, y, rx + 11, ry + 11, 0, {f:o.d || 'leafd', c:null, w:0, q:i/n}));
  blobs.forEach(([x,y,rx,ry], i) => A.ell(x, y, rx, ry, 0, {f:fk(i), c:null, w:0, q:i/n}));
  blobs.forEach(([x,y,rx,ry], i) => {
    if (y - ry > top + 70) return;           /* only the blobs on top catch the light */
    A.ell(x - rx*.28, y - ry*.34, rx*.42, ry*.26, -0.35, {f:o.l || 'leafl', c:null, w:0, op:.55, q:i/n});
  });
}
function scatter(rnd, cx, cy, rx, ry, n, gap){
  const out = [];
  for (let tries = 0; out.length < n && tries < n*60; tries++){
    const a = rnd()*Math.PI*2, r = Math.sqrt(rnd());
    const x = cx + Math.cos(a)*r*rx, y = cy + Math.sin(a)*r*ry;
    if (out.every(([u,v]) => Math.hypot(u-x, v-y) > gap)) out.push([x, y]);
  }
  return out;
}
function flower(A, x, y, r, fk, ck, o){
  for (let j=0;j<5;j++){
    const a = j/5*Math.PI*2 - Math.PI/2;
    A.dot(x + Math.cos(a)*r, y + Math.sin(a)*r, r*.62, Object.assign({f:fk, c:null, w:0}, o));
  }
  A.dot(x, y, r*.45, Object.assign({f:ck, c:null, w:0}, o));
}
function star(A, x, y, r, rot, fk){
  const pts = [];
  for (let j=0;j<10;j++){
    const a = rot - Math.PI/2 + j*Math.PI/5, rr = j % 2 ? r*.46 : r;
    pts.push([x + Math.cos(a)*rr, y + Math.sin(a)*rr]);
  }
  A.poly(pts, {f:fk, c:'leafd', w:2.2});
}
const jitter = rnd => (v, a) => v + (rnd() - .5)*a;

/* ================================================================ OAK (8) */
function trOak(rnd){
  const {A, items, names} = emitter(), J = jitter(rnd);
  prelude(A);
  A.stage('Trunk');
  trunk(A, [[452,900],[476,610],[478,560],[522,560],[524,610],[548,900]]);
  A.poly([[460,868],[416,906],[476,899]], {f:'bark', c:'barkd', w:4, o:[462,900]});
  A.poly([[540,868],[584,906],[524,899]], {f:'bark', c:'barkd', w:4, o:[538,900]});
  A.line(490, 865, 487, 650, {c:'barkd', w:3, op:.4});

  const e = [[J(360,40),J(495,30)], [J(645,40),J(480,30)], [J(495,30),J(385,20)]];
  A.stage('Branches');
  limbs(A, [[494,655,430,610,...e[0],22], [506,635,580,575,...e[1],20], [500,610,505,500,...e[2],18]]);

  A.stage('Leaves');
  cloud(A, e.map(([x,y]) => [x, y - 10, 95, 80]));

  A.stage('Crown');
  cloud(A, [[J(500,20),J(330,20),170,140],[J(355,20),J(425,20),140,115],[J(645,20),J(415,20),145,118],
            [J(430,20),J(280,16),120,100],[J(575,20),J(280,16),120,100],[500,J(475,16),175,90],
            [J(300,14),470,90,70],[J(700,14),465,90,70]], {f:['leaf','leaf','leaf2']});

  A.stage('Acorns');
  scatter(rnd, 500, 400, 230, 150, 7, 64).forEach(([x,y]) => {
    A.line(x, y - 16, x + 3, y - 27, {c:'barkd', w:3});
    A.ell(x, y + 6, 14, 18, 0, {f:'fruit', c:'fruitd', w:3});
    A.ell(x, y - 8, 17, 9, 0, {f:'barkd', c:null, w:0});
  });
  return {items, names};
}

/* =============================================================== PINE (8) */
function trPine(rnd){
  const {A, items, names} = emitter(), J = jitter(rnd);
  prelude(A);
  A.stage('Trunk');
  trunk(A, [[474,900],[490,330],[510,330],[526,900]]);
  const tier = (name, yb, hw, apex) => {
    A.stage(name);
    const pts = [[500, apex]], N = 6;
    for (let j=0;j<=N;j++) pts.push([500 - hw + 2*hw*j/N, yb + (j % 2 ? 26 : 0)]);
    A.poly(pts, {f:'leaf', c:'leafd', w:9, o:[500, (yb + apex)/2]});
    A.poly([[500, apex + 40],[500 - hw*.62, yb - 16],[500 - hw*.28, yb - 24]],
      {f:'leafl', c:null, w:0, op:.45, o:[500, apex + 40]});
  };
  tier('Lower boughs', 790, J(245,24), 470);
  tier('Middle boughs', 620, J(195,20), 300);
  tier('Treetop', 450, J(135,16), 145);
  A.stage('Cones');
  [[375,812],[615,808],[420,640],[585,636],[462,470],[540,468]].forEach(([x,y]) => {
    const cx = J(x, 30), cy = J(y, 10);
    A.ell(cx, cy, 13, 21, 0, {f:'fruit', c:'fruitd', w:3});
    A.line(cx - 8, cy - 4, cx + 8, cy - 4, {c:'fruitd', w:2, op:.6});
    A.line(cx - 8, cy + 6, cx + 8, cy + 6, {c:'fruitd', w:2, op:.6});
  });
  return {items, names};
}

/* ============================================================= CHERRY (8) */
function trCherry(rnd){
  const {A, items, names} = emitter(), J = jitter(rnd);
  prelude(A);
  A.stage('Trunk');
  trunk(A, [[452,900],[480,650],[470,600],[522,590],[532,650],[550,900]]);
  A.line(497, 870, 494, 640, {c:'barkd', w:3, op:.4});

  const e = [[J(275,30),J(520,24)], [J(730,30),J(505,24)], [J(395,24),J(395,24)], [J(615,24),J(385,24)], [J(505,20),J(320,16)]];
  A.stage('Branches');
  limbs(A, [[490,632,400,585,...e[0],18], [510,622,610,565,...e[1],18], [495,612,460,505,...e[2],15],
            [505,606,570,495,...e[3],15], [500,600,500,455,...e[4],12]]);

  A.stage('Buds');
  e.forEach(([x,y]) => { for (let k=0;k<3;k++) A.dot(J(x,70), J(y - 10,40), 10, {f:'fruit', c:'fruitd', w:2}); });

  A.stage('Blossom');
  cloud(A, [[e[0][0], e[0][1] - 20, 112, 80], [e[1][0], e[1][1] - 20, 112, 80], [e[2][0], e[2][1], 118, 92],
            [e[3][0], e[3][1], 118, 92], [e[4][0], e[4][1] + 10, 125, 88], [500, 445, 175, 88]],
        {f:['leaf','leaf','fruitl']});
  scatter(rnd, 500, 420, 255, 125, 16, 46).forEach(([x,y]) => flower(A, x, y, 10, 'white', 'fruit'));

  A.stage('Petals');
  for (let i=0;i<13;i++){
    const ground = i > 9;
    const x = ground ? 330 + rnd()*340 : 230 + rnd()*540;
    const y = ground ? 896 + rnd()*14 : 570 + rnd()*300;
    A.ell(x, y, 11, 6, rnd()*3, {f:'leaf', c:'fruitd', w:1.6});
  }
  return {items, names};
}

/* ============================================================== BIRCH (9) */
function trBirch(rnd){
  const {A, items, names} = emitter(), J = jitter(rnd);
  prelude(A);
  A.stage('Trunk');
  trunk(A, [[476,900],[488,320],[507,320],[520,900]]);
  trunk(A, [[512,900],[562,470],[575,474],[530,900]]);

  A.stage('Bark');
  for (let y = 862, k = 0; y > 360; y -= 50, k++){
    const hw = 9 + (y - 320)/580*13;
    if (k % 2) A.line(498 - hw, y, 498 - hw*.1, y - 4, {c:'barkd', w:6});
    else A.line(498 + hw*.1, y, 498 + hw, y + 4, {c:'barkd', w:6});
  }
  [[530,820],[545,700],[558,580]].forEach(([x,y]) => A.line(x - 6, y, x + 6, y - 3, {c:'barkd', w:5}));

  A.stage('Branches');
  [[495,560,J(415,20),J(470,20)],[502,505,J(588,20),J(432,20)],[498,435,J(445,16),J(352,16)],
   [500,400,J(562,16),J(335,16)],[562,520,J(628,16),J(468,16)]].forEach(([x1,y1,x2,y2]) =>
    A.line(x1, y1, x2, y2, {c:'barkd', w:7}));

  A.stage('Leaves');
  cloud(A, [[415,455,70,58],[590,420,70,58],[445,345,62,52],[565,330,62,52]]);

  A.stage('Crown');
  cloud(A, [[J(500,16),250,95,78],[J(425,16),318,92,80],[J(580,16),318,92,80],[395,J(418,16),85,72],
            [610,J(405,16),90,72],[455,J(498,12),92,62],[560,J(492,12),92,62],[500,375,115,100],[J(640,16),482,60,50]],
        {f:['leaf','leaf2']});

  A.stage('Catkins');
  scatter(rnd, 505, 410, 175, 150, 9, 52).forEach(([x,y]) => {
    A.line(x, y - 14, x + 2, y, {c:'barkd', w:2.5});
    A.ell(x + 2, y + 14, 6, 17, 0.1, {f:'fruit', c:'fruitd', w:2});
  });
  return {items, names};
}

/* =============================================================== PALM (8) */
function trPalm(rnd){
  const {A, items, names} = emitter(), J = jitter(rnd);
  prelude(A);
  const tx = J(585, 40), cxp = J(462, 30);
  const B  = t => { const u = 1 - t; return [u*u*500 + 2*u*t*cxp + t*t*tx, u*u*900 + 2*u*t*610 + t*t*330]; };
  const dB = t => [2*(1-t)*(cxp - 500) + 2*t*(tx - cxp), 2*(1-t)*(610 - 900) + 2*t*(330 - 610)];
  const L = [], R = [], M = [];
  for (let i=0;i<=12;i++){
    const t = i/12, [x,y] = B(t), [dx,dy] = dB(t), l = Math.hypot(dx, dy), w = 30 - 12*t;
    const nx = -dy/l, ny = dx/l;
    L.push([x + nx*w, y + ny*w]); R.push([x - nx*w, y - ny*w]); M.push([x, y, dx/l, dy/l]);
  }
  A.stage('Trunk');
  trunk(A, L.concat(R.slice().reverse()));

  A.stage('Rings');
  for (let i=1;i<12;i++){
    const [x,y,tx2,ty2] = M[i];
    A.path([L[i], [x - tx2*9, y - ty2*9], R[i]], {c:'barkd', w:3, op:.55});
  }

  const frond = (a, len, droop) => {
    const N = 16, up = [], dn = [], spine = [];
    for (let i=0;i<=N;i++){
      const t = i/N;
      const x = tx + Math.cos(a)*len*t, y = 330 + Math.sin(a)*len*t + droop*t*t;
      const dx = Math.cos(a)*len, dy = Math.sin(a)*len + 2*droop*t, l = Math.hypot(dx, dy);
      const w = len*.17*Math.pow(Math.sin(Math.PI*Math.min(1, t*1.05)), .7)*(i % 2 ? 1 : .55);
      up.push([x - dy/l*w, y + dx/l*w]); dn.push([x + dy/l*w, y - dx/l*w]); spine.push([x, y]);
    }
    A.poly(up.concat(dn.reverse()), {f:'leaf', c:'leafd', w:4, o:[tx, 330]});
    A.path(spine, {c:'leafd', w:4});
  };
  A.stage('Fronds');
  frond(-2.75, J(300,20), 190); frond(-0.35, J(290,20), 180); frond(-1.75, J(230,20), 120);
  A.stage('More fronds');
  frond(2.75, J(260,20), 110); frond(0.45, J(260,20), 100); frond(-2.25, J(250,20), 150); frond(-1.0, J(250,20), 150);

  A.stage('Coconuts');
  [[-20,22],[17,20],[-1,42]].forEach(([dx,dy]) => {
    A.dot(tx + dx, 330 + dy, 21, {f:'fruit', c:'fruitd', w:3});

function treePalette(id){

/* draw a tree into a square box of the given size. `k` shrinks it around the
   foot of the trunk, so a smaller tree still stands on the same ground. */
function drawOrg(ctx, org, p, bx, by, size, opt){
  opt = opt || {};
  const solid = opt.alpha != null ? opt.alpha : 1;
  const k = opt.k || 1, s = size/org.S;
  const X = x => bx + (500 + (x - 500)*k)*s, Y = y => by + (900 + (y - 900)*k)*s, L = v => v*k*s;
  const P = opt.pal || treePalette(org.tree);
  const stF = clamp(p, 0, 1)*org.nst;
  const stage = Math.floor(stF), frac = stF - stage;

  /* per-stage item index, so a stage builds up piece by piece */
  const idxIn = {}, cntIn = {};
  org.items.forEach(it => { cntIn[it.st] = (cntIn[it.st] || 0) + 1; });

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const it of org.items){
    const i = (idxIn[it.st] = (idxIn[it.st] || 0)), n = cntIn[it.st];
    idxIn[it.st]++;
    if (it.gnd && opt.noGround) continue;
    let g = 1, alpha = solid*(it.op != null ? it.op : 1);
    if (!it.gnd){
      if (it.st > stage) continue;
      if (it.st === stage){
        const t0 = (it.q != null ? it.q : i/n)*0.55;
        g = clamp((frac - t0)/0.45, 0, 1);
        if (g <= 0.001) continue;              /* this piece simply is not there yet */
      }
      if (it.un != null){
        if (stage > it.un + 1) continue;
        if (stage === it.un + 1){ alpha *= 1 - clamp(frac/0.5, 0, 1); if (alpha <= 0.01) continue; }
      }
    }

    const stroke = it.c === null ? null : P[it.c || 'barkd'];
    const fill = it.f ? P[it.f] : null;
    const lw = Math.max(0.6, L(it.w != null ? it.w : 2.4));
    const strokeIt = () => { if (!stroke || !it.w) return; ctx.strokeStyle = rgba(stroke, alpha); ctx.lineWidth = lw; ctx.stroke(); };
    const fillIt = () => { if (!fill) return; ctx.fillStyle = rgba(fill, alpha); ctx.fill(); };

    ctx.beginPath();
    if (it.k === 'line'){
      ctx.moveTo(X(it.x1), Y(it.y1));
      ctx.lineTo(X(it.x1 + (it.x2-it.x1)*g), Y(it.y1 + (it.y2-it.y1)*g));
      strokeIt();
    } else if (it.k === 'path'){
      const n2 = Math.max(2, Math.round(it.pts.length*g));
      it.pts.slice(0, n2).forEach(([x,y], j) => j ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)));
      fillIt(); strokeIt();
    } else if (it.k === 'curve'){
      /* the first g of the curve, split exactly (de Casteljau) */
      const u = 1 - g;
      const cx = it.x1 + (it.cx - it.x1)*g, cy = it.y1 + (it.cy - it.y1)*g;
      const ex = u*u*it.x1 + 2*u*g*it.cx + g*g*it.x2, ey = u*u*it.y1 + 2*u*g*it.cy + g*g*it.y2;
      ctx.moveTo(X(it.x1), Y(it.y1));
      ctx.quadraticCurveTo(X(cx), Y(cy), X(ex), Y(ey));
      strokeIt();
    } else if (it.k === 'poly'){
      const o = it.o || [it.pts.reduce((a,q) => a + q[0], 0)/it.pts.length,
                         it.pts.reduce((a,q) => a + q[1], 0)/it.pts.length];
      it.pts.forEach(([x,y], j) => {
        const px = o[0] + (x - o[0])*g, py = o[1] + (y - o[1])*g;
        j ? ctx.lineTo(X(px), Y(py)) : ctx.moveTo(X(px), Y(py));
      });
      ctx.closePath();
      fillIt(); strokeIt();
    } else if (it.k === 'dot'){
      ctx.arc(X(it.x), Y(it.y), Math.max(0.5, L(it.r*g)), 0, 6.2832);
      fillIt(); strokeIt();
    } else if (it.k === 'ell'){
      ctx.ellipse(X(it.x), Y(it.y), Math.max(0.4, L(it.rx*g)), Math.max(0.4, L(it.ry*g)), it.rot || 0, 0, 6.2832);
      fillIt(); strokeIt();
    }
  }
}
function fitCanvas(canvas){
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const box = canvas.getBoundingClientRect();
  const w = Math.round(box.width), h = Math.round(box.height);
  if (w < 24 || h < 24) return null;
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return {ctx, w, h};
}
function drawOrganism(canvas, org, p, opt){
  const c = fitCanvas(canvas);
  if (!c) return;
  const side = Math.min(c.w, c.h);
  drawOrg(c.ctx, org, p, (c.w - side)/2, (c.h - side)/2, side, opt);
}

function arcPath(deg){
  if (deg <= 0.4) return '';
  if (deg >= 359.6)
    return `M${C_DIAL} ${C_DIAL-R_DIAL} A${R_DIAL} ${R_DIAL} 0 1 1 ${C_DIAL-0.01} ${C_DIAL-R_DIAL}`;
  const [x1,y1] = polar(0, R_DIAL), [x2,y2] = polar(deg, R_DIAL);
  return `M${x1} ${y1} A${R_DIAL} ${R_DIAL} 0 ${deg > 180 ? 1 : 0} 1 ${x2} ${y2}`;
}
const minToDeg = m => m/MAX_MINUTES*360;

function paintDial(degOverride){
  const deg = degOverride != null ? degOverride : minToDeg(DB.prefs.minutes);
  $('#arc').setAttribute('d', arcPath(deg));
  const [hx,hy] = polar(deg, R_DIAL);
  $('#hOuter').setAttribute('cx', hx); $('#hOuter').setAttribute('cy', hy);
  $('#hInner').setAttribute('cx', hx); $('#hInner').setAttribute('cy', hy);
  setDialValue(Math.round(DB.prefs.minutes));
}

(function dialDrag(){
  const wrap = $('#dialwrap');
  let acc = 0, last = 0, dragging = false;
  const rel = e => {
    const r = wrap.getBoundingClientRect();
    return [e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2), r.width/2];
  };
  const angleAt = e => { const [dx,dy] = rel(e); return (Math.atan2(dy, dx)*180/Math.PI + 90 + 360) % 360; };
  const inRing = e => { const [dx,dy,R] = rel(e); const d = Math.hypot(dx, dy)/R; return d > 0.56 && d < 1.20; };
  wrap.addEventListener('pointerdown', e => {
    if (!inRing(e)) return;
    dragging = true;
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    acc = minToDeg(DB.prefs.minutes);
    last = angleAt(e);
    e.preventDefault();
  });
  wrap.addEventListener('pointermove', e => {
    if (!dragging) return;
    const a = angleAt(e);
    let d = a - last;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    last = a;
    acc = clamp(acc + d, minToDeg(MIN_MINUTES), 360);
    const snapped = clamp(Math.round(acc/360*MAX_MINUTES/STEP_MINUTES)*STEP_MINUTES,
      MIN_MINUTES, MAX_MINUTES);
    const changed = snapped !== DB.prefs.minutes;
    DB.prefs.minutes = snapped;
    paintDial(acc);                          /* the ring tracks the finger, not the step */
    if (changed) paintPreview();
  });
  const end = () => { if (dragging){ dragging = false; paintDial(); save(); } };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
})();

/* =============================================================== SESSION */
/* iOS cannot tell a locked screen from another app: both are just "hidden",
   and no API separates them. So it is a choice, not a detection:
     count — hidden time still counts (right when Guided Access is on, because
             then the only way to hide the page is the power button)
     pause — hidden time is not focus time, the clock stops
     kill  — hidden longer than the grace period ends the session, and it
             plants nothing                                                   */
/* Past the planned time the session keeps running on its own — overtime —
   until Finish is tapped, the app is left, or the cap is reached. */
const capOf = a => Math.min(a.plannedMs + OVERTIME_MAX, SESSION_CAP);
/* A pomodoro break is time the app itself takes off the clock, so it is
   subtracted like a pause — and while it runs, being away costs nothing. */
function studiedOf(a, now){
  const brk = a.breakStart != null ? now - a.breakStart : 0;
  const live = brk ? 0 : (a.awayAt != null && DB.prefs.away !== 'count' ? now - a.awayAt : 0);
  return clamp(now - a.startAt - (a.pausedMs || 0) - (a.breakMs || 0) - brk - live, 0, capOf(a));
}
function breakLenFor(block){ return block % POM.every === 0 ? POM.long : POM.short; }
/* how a planned stretch is cut into blocks, for the home screen */
function pomPlan(ms){
  const blocks = Math.max(1, Math.ceil(ms/POM.block));
  return {blocks, breaks: blocks - 1};
}
function resolve(a, now, graceMs, mode){
  const cap = capOf(a);
  if (a.breakStart != null)                 /* on a break nothing can go wrong */
    return {kind:'break', until: a.breakStart + a.breakLen, studied: studiedOf(a, now)};
  if (a.awayAt != null && mode !== 'count'){
    const atAway = clamp(a.awayAt - a.startAt - (a.pausedMs || 0), 0, cap);
    /* already past the planned time: leaving just banks the overtime */
    if (atAway >= a.plannedMs) return {kind:'done', at: a.awayAt, studied: atAway};
    if (mode === 'kill' && now - a.awayAt >= graceMs)
      return {kind:'lost', at: a.awayAt + graceMs, studied: atAway};
    return {kind:'paused'};
  }
  const st = studiedOf(a, now);
  if (st >= cap) return {kind:'done', at: a.startAt + cap + (a.pausedMs || 0), studied: cap};
  return {kind:'running', studied: st, over: st >= a.plannedMs};
}

let ORG = null, rafId = 0;

function setSessionChip(id){
  $('#sesDot').style.background = uiOf(id);
  $('#sesName').textContent = TREE[id].name;
}
function startSession(){
  unlockAudio();
  const id = DB.prefs.tree, now = Date.now();
  DB.active = {tree:id, seed:newSeed(), startAt:now, plannedMs:Math.round(DB.prefs.minutes)*60000,
    awayAt:null, pausedMs:0, hiddenMs:0, seen:now, chimed:false, escapes:0,
    pom: !!DB.prefs.pomodoro, breakStart:null, breakLen:0, breakMs:0, blocksDone:0};
  save();
  ORG = buildTree(id, DB.active.seed);
  applyTreeColor(id);
  setSessionChip(id);
  setOvertime(false); setBreak(false);
  show('session');
  requestWakeLock();
  loop();
}

function endSession(status, at, studied, awayMs){
  const a = DB.active;
  if (!a) return;
  const actual = Math.max(0, Math.round(studied));
  const ok = status === 'done';
  const out = {status, actual, coins: ok ? Math.round(actual/60000)*COIN_PER_MIN : 0,
    tree:a.tree, seed:a.seed, awayMs, p: clamp(actual/a.plannedMs, 0, 1),
    pausedMs:a.pausedMs || 0, overMs: Math.max(0, actual - a.plannedMs), n:0};

  /* a lost session plants nothing, but nothing already planted is ever lost */
  if (ok){
    DB.coins += out.coins;
    DB.forest.push({tree:a.tree, seed:a.seed, at, ms:actual, sid:a.startAt});
    out.n = DB.forest.length;
  }
  DB.sessions.push({id:a.startAt, tree:a.tree, startAt:a.startAt, endAt:at,
    plannedMs:a.plannedMs, actualMs:actual, pausedMs:a.pausedMs || 0,
    hiddenMs:a.hiddenMs || 0, status, coins:out.coins, escapes:a.escapes});
  DB.active = null;
  save();
  releaseWakeLock();
  stopLoop();
  showResult(out);
}

let tickId = 0, lastDrawP = -1, lastDrawK = -1, lastDrawAt = 0;
function loop(){
  stopLoop();
  const tick = () => {
    const a = DB.active;
    if (!a) return;
    const now = Date.now();
    const r = resolve(a, now, DB.prefs.grace*1000, DB.prefs.away);
    if (r.kind === 'lost'){ beep('lost'); endSession('escaped', r.at, r.studied, DB.prefs.grace*1000); return; }
    if (r.kind === 'done'){ beep('done'); endSession('done', r.at, r.studied, 0); return; }

    if (r.kind === 'break'){
      if (now >= r.until){                       /* break over, back to it */
        a.breakMs = (a.breakMs || 0) + a.breakLen;
        a.breakStart = null; a.breakLen = 0;
        beep('done'); save();
      } else {
        const left = r.until - now;
        setOvertime(false);
        setBreak(true);
        $('#clock').textContent = fmtClock(left);
        $('#sesArc').setAttribute('d', arcPath(clamp(1 - left/a.breakLen, 0, 1)*359.9));
        $('#sesState').innerHTML = `break time · block <b>${a.blocksDone + 1}</b> starts in a moment`;
        if (now - (a.seen || 0) > 15000){ a.seen = now; save(); }
        return;
      }
    }
    setBreak(false);

    const studied = studiedOf(a, now), cap = capOf(a);
    const over = studied >= a.plannedMs && cap > a.plannedMs;

    /* a whole block done and more to come: take the break */
    if (a.pom && !over && studied < a.plannedMs){
      const blocks = Math.floor(studied/POM.block);
      if (blocks > (a.blocksDone || 0)){
        a.blocksDone = blocks;
        a.breakLen = breakLenFor(blocks);
        a.breakStart = now;
        beep('done'); save();
        return;
      }
    }
    if (over && !a.chimed){ a.chimed = true; beep('done'); save(); }
    setOvertime(over);
    $('#clock').textContent = over ? '+' + fmtClock(studied - a.plannedMs)
                                   : fmtClock(a.plannedMs - studied);
    $('#sesArc').setAttribute('d', arcPath(clamp(over
      ? (studied - a.plannedMs)/(cap - a.plannedMs)
      : studied/a.plannedMs, 0, 1)*359.9));
    const p = clamp(studied/a.plannedMs, 0, 1);
    $('#sesState').innerHTML = over
      ? `fully grown · overtime up to <b>+${fmtDur(cap - a.plannedMs)}</b>`
      : `<b>${stageName(ORG, p)}</b>` + (a.pausedMs > 30000 ? ` · ${fmtDur(a.pausedMs)} paused` : '');

    /* between one second and the next the drawing changes by an amount nobody
       can see, so it is repainted on a real change, not on every frame */
    const k = kOfMs(Math.max(a.plannedMs, studied));
    if (Math.abs(p - lastDrawP) > 0.0012 || Math.abs(k - lastDrawK) > 0.004 || now - lastDrawAt > 8000){
      drawOrganism($('#organism'), ORG, p, {k});
      lastDrawP = p; lastDrawK = k; lastDrawAt = now;
    }
    if (now - (a.seen || 0) > 15000){ a.seen = now; save(); }  /* heartbeat: survives a hard kill */
  };
  lastDrawP = lastDrawK = -1; lastDrawAt = 0;
  tick();
  tickId = setInterval(tick, 1000);
}
function stopLoop(){
  clearInterval(tickId); tickId = 0;
  cancelAnimationFrame(rafId); rafId = 0;
}

function showResult(o){
  const t = TREE[o.tree], org = buildTree(o.tree, o.seed);
  applyTreeColor(o.tree);
  const ok = o.status === 'done';
  const gave = o.status === 'abandoned';      /* own decision, as opposed to leaving */
  const k = kOfMs(Math.max(o.actual, 60000));

  $('#resTitle').textContent = ok ? `${t.name} planted!` : gave ? 'Stopped early' : 'You wandered off';
  $('#resTitle').style.color = ok ? 'var(--sub)' : 'var(--ink)';
  $('#resSub').textContent = ok
    ? (o.pausedMs > 30000 ? `It's in your forest now, with ${fmtDur(o.pausedMs)} paused along the way.`
                          : `It's in your forest now. You stayed with it the whole time.`)
    : gave ? `This one stays a ${stageName(org, o.p).toLowerCase()} for now. Your forest is just as you left it.`
    : `You were away for more than ${DB.prefs.grace} seconds, so it didn't take root. Your forest is just as you left it.`;
  $('#resGain').innerHTML =
    `<span class="pill">${fmtDur(o.actual)}</span>` +
    (o.overMs > 30000 ? `<span class="pill">+${fmtDur(o.overMs)} overtime</span>` : '') +
    (o.coins ? `<span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="var(--coin)"></circle></svg>+${o.coins}</span>` : '');
  $('#resNote').textContent = ok

      drawOrganism($('#organism2'), org, p, {k, alpha: ok ? 1 : .55});
      if (ok && dt < 1000) rafId = requestAnimationFrame(anim);

/* leaving the app: record the timestamp, never the event */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    /* iOS keeps a page alive in the background for as long as its audio session
       is live, and a live page keeps burning battery. Put it all to sleep. */
    stopLoop();
    releaseWakeLock();
    try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {}
    if (DB.active){ DB.active.awayAt = Date.now(); save(); }
    return;
  }
  try { if (AC && AC.state === 'suspended') AC.resume(); } catch (e) {}
  if (DB.active) handleReturn();
});
window.addEventListener('pagehide', () => {
  if (DB.active && DB.active.awayAt == null){ DB.active.awayAt = Date.now(); save(); }
});

function handleReturn(){
  const a = DB.active;
  if (!a || a.awayAt == null) return;
  const now = Date.now(), away = now - a.awayAt, mode = DB.prefs.away;
  const r = resolve(a, now, DB.prefs.grace*1000, mode);
  if (r.kind === 'lost'){ save(); beep('lost'); endSession('escaped', r.at, r.studied, away); return; }

  a.hiddenMs = (a.hiddenMs || 0) + away;
  if (mode === 'pause' && a.breakStart == null) a.pausedMs = (a.pausedMs || 0) + away;
  a.awayAt = null;
  a.seen = now;

  const after = resolve(a, now, DB.prefs.grace*1000, mode);
  if (after.kind === 'done'){ save(); beep('done'); endSession('done', after.at, after.studied, away); return; }
  if (mode === 'pause' && away > 2000) flash(`Paused ${fmtDur(away)} · not counted`, true);
  save(); requestWakeLock(); loop();
}

let flashTimer = 0;
function flash(msg, neutral){

/* ------------------------------------------------------- audio & screen */
let AC = null;
function unlockAudio(){
  if (!DB.prefs.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended' && !document.hidden) AC.resume();
  } catch (e) {}
}
function beep(kind){
  if (!AC || !DB.prefs.sound) return;
  try {
    const t = AC.currentTime, notes = kind === 'done' ? [523.25, 659.25, 783.99, 1046.5] : [392, 329.63];
    notes.forEach((f,i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      const t0 = t + i*(kind === 'done' ? .13 : .3);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(kind === 'done' ? .2 : .18, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + (kind === 'done' ? .55 : .8));
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0 + 1);
    });
  } catch (e) {}
}
let wakeLock = null;
async function requestWakeLock(){
  try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseWakeLock(){ try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

/* ================================================================== MOTION */
/* A tap is a step, and a step takes time: the view on screen fades out, the
   work happens while nothing is visible, the next one fades in. Two numbers
   set the whole pace. Someone who asked iOS for less motion gets none of it. */
const CALM = matchMedia('(prefers-reduced-motion: reduce)');
const outMs = () => CALM.matches ? 0 : 130;
const inMs  = () => CALM.matches ? 0 : 260;

let moving = false, moveA = 0, moveB = 0;

/* leave the current view, run `work` (by default just switch), arrive */
function go(v, work){
  const from = $('#v-' + currentView);
  clearTimeout(moveA); clearTimeout(moveB);
  document.querySelectorAll('.view').forEach(x => x.classList.remove('leaving','entering'));
  moving = true;
  from.classList.add('leaving');
  moveA = setTimeout(() => {
    from.classList.remove('leaving');
    (work || (() => show(v)))();
    const to = $('#v-' + currentView);
    to.classList.add('entering');
    moveB = setTimeout(() => { to.classList.remove('entering'); moving = false; }, inMs());
  }, outMs());
}

/* the same move inside one view: the block leaves, is rebuilt, comes back.
   `dir` slides it sideways instead — +1 goes forward, -1 back. */
function swap(el, work, dir){
  if (!el) return work();
  dir = dir || 0;
  el.style.setProperty('--mx', (dir ? -dir*14 : 0) + 'px');
  el.style.setProperty('--my', dir ? '0px' : '-4px');
  el.style.setProperty('--nx', (dir ? dir*16 : 0) + 'px');
  el.style.setProperty('--ny', dir ? '0px' : '7px');
  clearTimeout(el._mvA); clearTimeout(el._mvB);
  el.classList.remove('entering');
  el.classList.add('leaving');
  el._mvA = setTimeout(() => {
    el.classList.remove('leaving');
    work();
    el.classList.add('entering');
    el._mvB = setTimeout(() => el.classList.remove('entering'), inMs());
  }, outMs());
}

/* a value that changed in place, so the eye catches it */
function bump(el){
  if (!el) return;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

/* a tap that leads somewhere: the button holds its press until the view goes */
function tap(el, fn){
  if (!el) return;
  el.onclick = e => {
    if (moving) return;
    el.classList.add('held');
    setTimeout(() => el.classList.remove('held'), outMs() + 90);
    fn(e);
  };
}

(function(){
  const btn = $('#abandon'), fill = $('#holdFill');
  let start = 0, id = 0;
  const stop = () => { cancelAnimationFrame(id); fill.style.width = '0%'; start = 0; };
  const tick = () => {

    fill.style.width = (p*100) + '%';
    if (p >= 1){ const n = Date.now(); stop(); endSession('abandoned', n, studiedOf(DB.active, n), 0); return; }
    id = requestAnimationFrame(tick);

  btn.addEventListener('pointerdown', e => {

      const a = DB.active, n = Date.now();

    if (inOvertime){                       /* the tree is already grown: one tap plants it */
      const n = Date.now();
      endSession('done', n, studiedOf(DB.active, n), 0);
      return;
    }
    start = performance.now(); tick();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => btn.addEventListener(ev, stop));
})();

    </button>`;
  });
  openSheet(html + `</div>`);
  const body = $('#sheetBody');
  paintMinis(body);
  const picked = () => { save(); closeSheet(); paintPreview(); bump($('#treeBtn')); };
  tap($('#spRandom'), () => {
    DB.prefs.surprise = true; DB.prefs.tree = randomOwned(DB.prefs.tree); picked();
  });
  body.querySelectorAll('.sp[data-id]').forEach(b => tap(b, () => {
    const t = TREE[b.dataset.id];
    if (isOwned(t.id)){
      DB.prefs.tree = t.id; DB.prefs.surprise = false; picked();

      DB.coins -= t.cost; DB.owned[t.id] = true; DB.prefs.tree = t.id; DB.prefs.surprise = false; picked();
      flashOk(`${t.name} unlocked!`);
    } else {
      flash(`${t.cost - DB.coins} more coins to go`, true);
    }
  }));
}

/* =================================================================== STATS */
let scope = 'day', anchor = new Date();

/* midnight on the Monday of that date — built from calendar fields, never
   from a subtraction, so the two DST weekends stay whole */
function weekStart(x){
  const d = new Date(x.getFullYear(), x.getMonth(), x.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

function periodRange(){
  const d = anchor;
  if (scope === 'day'){
    const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return [a.getTime(), addDays(a, 1).getTime()];
  }
  if (scope === 'week'){
    const a = weekStart(d);
    return [a.getTime(), addDays(a, 7).getTime()];
  }
  if (scope === 'month')
    return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(),
            new Date(d.getFullYear(), d.getMonth()+1, 1).getTime()];
  return [new Date(d.getFullYear(), 0, 1).getTime(), new Date(d.getFullYear()+1, 0, 1).getTime()];
}
function periodLabel(){
  const d = anchor, n = new Date();
  if (scope === 'day'){
    if (dayKey(d.getTime()) === dayKey(n.getTime())) return 'Today';
    if (dayKey(d.getTime()) === dayKey(n.getTime() - 86400000)) return 'Yesterday';
    return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
  }
  if (scope === 'week'){
    const a = weekStart(d), b = addDays(a, 6);
    const back = Math.round((weekStart(n).getTime() - a.getTime())/86400000);
    if (back === 0) return 'This week';
    if (back === 7) return 'Last week';
    return `${a.getDate()} ${MON3[a.getMonth()]} – ${b.getDate()} ${MON3[b.getMonth()]}`;
  }
  if (scope === 'month') return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  return String(d.getFullYear());
}
function shift(dir){
  const d = new Date(anchor);
  if (scope === 'day') d.setDate(d.getDate() + dir);
  else if (scope === 'week') d.setDate(d.getDate() + dir*7);
  else if (scope === 'month') d.setMonth(d.getMonth() + dir);
  else d.setFullYear(d.getFullYear() + dir);
  anchor = d;
  renderStats();
}
function isFuture(){
  const d = anchor, n = new Date();
  if (scope === 'day') return dayKey(d.getTime()) >= dayKey(n.getTime());
  if (scope === 'week') return weekStart(d).getTime() >= weekStart(n).getTime();
  if (scope === 'month') return d.getFullYear() > n.getFullYear() ||
    (d.getFullYear() === n.getFullYear() && d.getMonth() >= n.getMonth());
  return d.getFullYear() >= n.getFullYear();
}
function streakDays(){
  const done = new Set(DB.sessions.filter(s => s.status === 'done').map(s => dayKey(s.startAt)));
  let n = 0;
  const d = new Date();
  if (!done.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
  while (done.has(dayKey(d.getTime()))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

function barChart(values, labels, axis, title, opt){
  opt = opt || {};
  const peak = Math.max(...values);
  const max = Math.max(1, opt.max || peak), maxIdx = values.indexOf(peak);
  const bars = values.map((v,i) =>
    `<button data-i="${i}" aria-pressed="false" aria-label="${labels[i]}: ${fmtDur(v)}"><i class="${v ? '' : 'zero'}" style="height:${v ? Math.max(4, Math.min(1, v/max)*100) : 0}%"></i></button>`).join('');
  const init = peak > 0
    ? `<span>Best · ${labels[maxIdx]}</span><b>${fmtDur(values[maxIdx])}</b>`
    : `<span>No sessions</span><b>0m</b>`;
  return `<div class="chart">
    <div class="cap"><span class="t">${title}</span><span class="m">${opt.scale || 'peak ' + fmtDur(max)}</span></div>
    <div class="bars" id="bars">${bars}</div>
    <div class="axis">${axis.map(a => `<span>${a}</span>`).join('')}</div>
    <div class="readbox" id="readbox">${init}</div></div>`;
}
function bindBars(values, labels){
  const bars = $('#bars');
  if (!bars) return;
  bars.querySelectorAll('button').forEach(b => b.onclick = () => {
    bars.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    const i = +b.dataset.i;
    $('#readbox').innerHTML = `<span>${labels[i]}</span><b>${fmtDur(values[i])}</b>`;
    bump($('#readbox'));
  });
}
/* Minutes per hour of the day. A session is spread over the wall clock it
   actually spans, so the focused time lands in the hours it happened in;
   pauses and breaks stretch that span, which is why it is a share and not
   a straight copy of actualMs. */
function hourValues(list){
  const v = Array(24).fill(0);
  list.forEach(s => {
    const span = Math.max(60000, (s.endAt || s.startAt + s.actualMs) - s.startAt);
    const rate = s.actualMs/span;
    let t = s.startAt;
    const end = s.startAt + span;
    while (t < end){
      const d = new Date(t);
      const next = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours()+1).getTime();
      const chunk = Math.min(end, next) - t;
      v[d.getHours()] += chunk*rate;
      t += chunk;
    }
  });
  return v.map(x => Math.min(x, 3600000));
}

function renderStats(){
  $('#periodLabel').textContent = periodLabel();
  $('#next').disabled = isFuture();
  document.querySelectorAll('#scope button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.scope === scope)));
  applyTreeColor(DB.prefs.tree);

  const [from, to] = periodRange();
  const list = DB.sessions.filter(s => s.startAt >= from && s.startAt < to).sort((a,b) => a.startAt - b.startAt);
  const total = list.reduce((n,s) => n + s.actualMs, 0);
  const done = list.filter(s => s.status === 'done').length;
  const lost = list.length - done;

  let html = `<div class="hero"><span class="v">${fmtDur(total)}</span><span class="u">of focus</span></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${done}</div><div class="k">trees planted</div></div>
      <div class="kpi"><div class="v">${lost}</div><div class="k">stopped early</div></div>
      <div class="kpi"><div class="v">${streakDays()}</div><div class="k">day streak</div></div>
    </div>`;

  let values = null, labels = null;
  if (scope === 'day'){
    if (list.length){
      values = hourValues(list);
      labels = values.map((_,h) => `${pad2(h)}:00 – ${pad2((h+1)%24)}:00`);
      html += barChart(values, labels, ['00:00','06:00','12:00','18:00','24:00'],
        'Time per hour', {max:3600000, scale:'full bar = 1h'});
    }
    html += `<div class="slist"><h3>Sessions</h3>`;
    if (!list.length) html += `<div class="empty">Nothing yet today.<br>A tree is one session away.</div>`;
    else list.forEach(s => {
      const ko = s.status !== 'done';
      html += `<div class="sess ${ko ? 'ko' : ''}">
        <span class="when">${new Date(s.startAt).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})}</span>
        <span class="dotc" style="background:${uiOf(s.tree)}"></span>
        <span class="nm">${TREE[s.tree] ? TREE[s.tree].name : 'Session'}</span>
        ${ko ? `<span class="tag">${s.status === 'escaped' ? 'wandered off' : 'stopped early'}</span>` : ''}
        <span class="len">${fmtDur(s.actualMs)}</span></div>`;
    });
    html += `</div>`;
  } else if (scope === 'week'){
    const a = weekStart(anchor);
    values = Array(7).fill(0);
    labels = DAY3.map((n,i) => `${n} ${addDays(a, i).getDate()}`);
    list.forEach(s => { values[(new Date(s.startAt).getDay() + 6) % 7] += s.actualMs; });
    html += barChart(values, labels, ['Mon','Thu','Sun'], 'Time per day');
  } else if (scope === 'month'){
    const y = anchor.getFullYear(), m = anchor.getMonth(), days = new Date(y, m+1, 0).getDate();
    values = Array(days).fill(0);
    labels = Array.from({length:days}, (_,i) => `${MON3[m]} ${i+1}`);
    list.forEach(s => { values[new Date(s.startAt).getDate()-1] += s.actualMs; });
    html += barChart(values, labels, ['1', String(Math.ceil(days/2)), String(days)], 'Time per day');
  } else {
    values = Array(12).fill(0);
    labels = MONTHS.slice();
    list.forEach(s => { values[new Date(s.startAt).getMonth()] += s.actualMs; });
    html += barChart(values, labels, ['Jan','Jun','Dec'], 'Time per month');
  }

  const allTime = DB.sessions.reduce((n,s) => n + s.actualMs, 0);
  html += `<div class="foot">${fmtDur(allTime)} in total · ${DB.sessions.length} sessions · ${DB.forest.length} trees</div>`;
  $('#statsBody').innerHTML = html;
  if (values) bindBars(values, labels);
}

let fscope = 'week';
function forestRange(){
  const n = new Date(), today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  if (fscope === 'today') return [today.getTime(), addDays(today, 1).getTime()];
  if (fscope === 'week'){ const a = weekStart(n); return [a.getTime(), addDays(a, 7).getTime()]; }
  if (fscope === 'month') return [new Date(n.getFullYear(), n.getMonth(), 1).getTime(),
                                  new Date(n.getFullYear(), n.getMonth() + 1, 1).getTime()];
  return [0, Infinity];
}
const FOREST_EMPTY = {
  today: 'Nothing planted today yet.<br>Your first tree is one session away.',
  week:  'A brand new week, a bare hill.<br>Plant something!',
  month: 'No trees this month yet.<br>Time to start a grove.',
  all:   'Your forest is waiting for its first tree.',
};
function forestList(){
  const [from, to] = forestRange();
  return DB.forest.filter(t => TREE[t.tree] && t.at >= from && t.at < to).sort((a,b) => a.at - b.at);
}
function renderForest(){

  const rows = Object.keys(by).sort((a,b) => by[b].n - by[a].n || by[b].ms - by[a].ms);
  if (rows.length){

/* A hill under a sky, and every tree of the period planted on it in rows:
   the back rows smaller, the front ones overlapping them. The order on the
   hill is shuffled, so neighbours are not just consecutive sessions. */
function paintMeadow(canvas, list){
  const c = fitCanvas(canvas);
  if (!c) return;
  const {ctx, w:W, h:H} = c, dk = isDark();

  /* sun or moon */
  const sx = W*.85, sy = H*.15, sr = H*.065;
  const glow = ctx.createRadialGradient(sx, sy, sr*.5, sx, sy, sr*3);
  glow.addColorStop(0, dk ? 'rgba(230,230,255,.28)' : 'rgba(255,214,102,.55)');
  glow.addColorStop(1, 'rgba(255,214,102,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H*.5);
  ctx.fillStyle = dk ? '#f3efd9' : '#ffd25e';
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 6.2832); ctx.fill();

  const hill = (y0, c1, c2, y3, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, H*y0);
    ctx.bezierCurveTo(W*.3, H*c1, W*.62, H*c2, W, H*y3);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  };
  hill(.40, .27, .31, .36, dk ? '#477f48' : '#a9da7c');
  hill(.66, .55, .62, .58, dk ? '#3d7041' : '#93cc69');

  const rf = mulberry32(42);
  const petals = dk ? ['#e8e3ff','#f6d77a','#e9a6c4'] : ['#ffffff','#ffd75e','#ff9fbf'];
  for (let i=0;i<34;i++){
    ctx.fillStyle = petals[i % 3];
    ctx.beginPath(); ctx.arc(rf()*W, H*(.44 + rf()*.54), 1.6 + rf()*1.4, 0, 6.2832); ctx.fill();
  }

  const N = list.length;
  if (!N) return;
  const x0 = W*.07, x1 = W*.93, y0 = H*.42, y1 = H*.96;
  const cols = Math.min(N, Math.max(1, Math.ceil(Math.sqrt(N*(x1 - x0)/(y1 - y0)*.9))));
  const rows = Math.ceil(N/cols);
  const cellW = (x1 - x0)/cols, cellH = (y1 - y0)/rows;
  const base = Math.min(cellW*1.55, cellH*2.3, H*.6);

  const order = list.slice(), rs = mulberry32(N*7919 + 17);
  for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(rs()*(i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const pals = {};
  for (let r = 0; r < rows; r++){
    const inRow = r === rows - 1 ? N - r*cols : cols;
    const depth = rows === 1 ? 1 : 0.74 + 0.26*r/(rows - 1);
    for (let col = 0; col < inRow; col++){
      const t = order[r*cols + col], rr = mulberry32(t.seed);
      const size = base*depth*kOfMs(t.ms);
      let x = W/2 + (col - (inRow - 1)/2)*cellW + (rr() - .5)*cellW*.35 + (r % 2 && inRow === cols ? cellW*.22 : 0);
      x = clamp(x, size*.32, W - size*.32);
      const y = y0 + (r + .5)*cellH + (rr() - .5)*cellH*.3;
      ctx.fillStyle = dk ? 'rgba(0,0,0,.22)' : 'rgba(40,70,20,.16)';
      ctx.beginPath(); ctx.ellipse(x, y + 1, size*.17, size*.035, 0, 0, 6.2832); ctx.fill();
      const pal = pals[t.tree] || (pals[t.tree] = treePalette(t.tree));
      drawOrg(ctx, buildTree(t.tree, t.seed), 1, x - size/2, y - size*.9, size, {noGround:true, pal});
    }
  }
}

(function initTheme(){
  const t = localStorage.getItem('epflfocus.theme');
  if (t) document.documentElement.dataset.theme = t;
  syncStatusBar();
})();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { syncStatusBar(); repaintAll(); });

document.querySelectorAll('#nav button').forEach(b =>
  b.onclick = () => { if (!DB.active) show(b.dataset.view); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchend', unlockAudio, {once:true, passive:true});
let lastW = 0;
new ResizeObserver(() => {
  const w = $('#app').clientWidth;
  if (currentView === 'home') paintPreview();
  else if (currentView === 'session') lastDrawP = -1;   /* let the next tick repaint at the new size */
  else if (currentView === 'forest' && w !== lastW) renderForest();
  lastW = w;
}).observe($('#app'));

paintDial();
if (DB.active){
  const now = Date.now(), a = DB.active;
  if (!TREE[a.tree]){ a.tree = 'oak'; a.seed = a.seed || newSeed(); }   /* started before the trees */
  a.pausedMs = a.pausedMs || 0;
  /* cold restart: everything since the last heartbeat was time off the app */
  if (a.awayAt == null) a.awayAt = a.seen || now;
  const r = resolve(a, now, DB.prefs.grace*1000, DB.prefs.away);
  applyTreeColor(a.tree);
  setSessionChip(a.tree);
  if (r.kind === 'lost') endSession('escaped', r.at, r.studied, now - a.awayAt);
  else {
    const gap = now - a.awayAt;
    a.hiddenMs = (a.hiddenMs || 0) + gap;
    if (DB.prefs.away === 'pause' && a.breakStart == null) a.pausedMs = (a.pausedMs || 0) + gap;
    a.awayAt = null; a.seen = now;
    const after = resolve(a, now, DB.prefs.grace*1000, DB.prefs.away);
    if (after.kind === 'done'){ save(); endSession('done', after.at, after.studied, gap); }
    else {
      save();
      ORG = buildTree(a.tree, a.seed);
      show('session'); requestWakeLock(); loop();
    }
  }
} else {
  DB.active = null;
  show('home');
}

if ('serviceWorker' in navigator){
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading || DB.active) return;      /* never yank the page mid-session */
    reloading = true;
    location.reload();
  });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
