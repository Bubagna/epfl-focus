  {id:'ot_fern',    sub:'other',  name:'Fern',                stages:12, cost:500},
];
SPECIES.forEach(s => { s.growth = s.stages * STAGE_MIN; });
const SP = Object.fromEntries(SPECIES.map(s => [s.id, s]));

/* ------------------------------------------------------------- storage */
const blank = () => ({
  v:3, coins:0, unlocked:{}, growing:{}, grove:[], sessions:[], active:null,
  prefs:{sp:null, minutes:45, sound:true, grace:15, away:'pause', pomodoro:false},
});
let DB = blank();
(function load(){
  try {
    const raw = localStorage.getItem(STORE);
    if (raw){
      DB = Object.assign(blank(), JSON.parse(raw));
      DB.prefs = Object.assign(blank().prefs, DB.prefs);
      return;
    }
    const old = JSON.parse(localStorage.getItem('crescita.v2') || 'null');
    if (old){                                  /* species were redrawn: remap by course */
      const remap = {cs473:'soc_pipe', cs472:'dt_aig', ee411:'il_clt', ee557:'sd_crystal',
                     ee429:'vl_inv', hum428:'en_oak', other:'ot_bonsai'};
      DB.coins = old.coins || 0;
      DB.sessions = (old.sessions || []).map(s => ({...s, sp: remap[s.subject] || 'ot_bonsai'}));
      DB.grove = (old.grove || []).map(g => ({...g, sp: remap[g.sub] || 'ot_bonsai'}));
      DB.prefs.minutes = (old.prefs && old.prefs.minutes) || 45;
    }
  } catch (e) {
    /* never lose the bytes: keep whatever could not be parsed */
    try { localStorage.setItem(STORE + '.corrupt', localStorage.getItem(STORE) || ''); } catch (e2) {}
    DB = blank();
  }
})();
DB.prefs.minutes = clamp(Math.round(DB.prefs.minutes/STEP_MINUTES)*STEP_MINUTES, MIN_MINUTES, MAX_MINUTES);
if (DB.prefs.strict !== undefined){                 /* migrate the old on/off switch */
  DB.prefs.away = DB.prefs.strict ? 'kill' : 'pause';
  delete DB.prefs.strict;
}
/* build 14 went from 20 minutes a part to 3 hours. Everything already in the
   ground stays on the old pace, so nothing shrinks and nothing is lost. */
Object.keys(DB.growing || {}).forEach(id => {
  const g = DB.growing[id];
  if (g && !g.per) g.per = g.ms > 0 ? LEGACY_STAGE_MS : STAGE_MS;
});
(DB.grove || []).forEach(g => {
  if (!g.gm && SP[g.sp]) g.gm = SP[g.sp].stages * LEGACY_STAGE_MS;
});
const AWAY_MODES = {
  count: 'Keeps counting',
  pause: 'Pauses the clock',
  kill:  'Kills the specimen',
};
/* A blank in-memory DB must never overwrite a stored history: whatever goes
   wrong upstream, the bytes on disk survive it. */
let knownSessions = DB.sessions.length;
function save(allowEmpty){
  if (!allowEmpty && DB.sessions.length === 0 && knownSessions > 0) return;
  knownSessions = DB.sessions.length;
  try { localStorage.setItem(STORE, JSON.stringify(DB)); } catch (e) {}
}

const isUnlocked = id => SP[id].cost === 0 || !!DB.unlocked[id];
/* A specimen keeps the pace it was started with: slowing growth down must
   never take parts away from one that is already half built. */
const stageMsOf = id => (DB.growing[id] && DB.growing[id].per) || STAGE_MS;
const growthMs = id => SP[id].stages * stageMsOf(id);
const graveGrowth = g => g.gm || SP[g.sp].stages * LEGACY_STAGE_MS;
const newSeed = () => ((Date.now() ^ (Math.random()*1e9 | 0)) >>> 0) % 2147483647;
function specimen(id){
  if (!DB.growing[id]) DB.growing[id] = {ms:0, seed:newSeed(), per:STAGE_MS};
  return DB.growing[id];
}

/* ---------------------------------------------------------------- utils */
const $ = s => document.querySelector(s);
/* iOS paints the notch strip with theme-color: keep it identical to the paper
   the page is actually using, or the top of the screen reads as a darker band */
/* iOS paints the strip above the page with theme-color and keeps it, so it has
   to stay exactly the paper the page is using. Nothing is allowed to cover it. */
function syncStatusBar(){
  const paper = (getComputedStyle(document.documentElement).getPropertyValue('--paper') || '').trim() || '#e9ede3';
  const light = document.querySelector('#themeColor'), dark = document.querySelector('#themeColorDark');
  if (dark) dark.remove();
  if (light && light.getAttribute('content') !== paper){
    light.removeAttribute('media');
    light.setAttribute('content', paper);
  }
}
function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }
const pad2 = n => String(n).padStart(2,'0');
const isDark = () => document.documentElement.dataset.theme === 'dark' ||
  (document.documentElement.dataset.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
const hueOf = id => isDark() ? SUB[id].dark : SUB[id].hue;

function fmtClock(ms){
  const t = Math.max(0, Math.ceil(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return h ? `${h}:${pad2(m)}:${pad2(s)}` : `${pad2(m)}:${pad2(s)}`;
}
function fmtDur(ms){
  const min = Math.round(ms/60000);
  const h = Math.floor(min/60), m = min%60;
  if (!h) return m + 'm';
  return m ? `${h}h ${m}m` : `${h}h`;
}
/* the dial still steps in minutes, but past an hour it reads as one */
function setDialValue(min){
  const h = Math.floor(min/60), m = min%60;
  $('#minVal').textContent = h ? (m ? `${h}h ${m}` : `${h}h`) : min;
  $('#minUnit').textContent = h ? (m ? 'm' : '') : 'min';
  $('#minUnit').className = h ? 'tight' : '';
}
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mixc = (a,b,t) => { const A = Array.isArray(a) ? a : hex2rgb(a), B = Array.isArray(b) ? b : hex2rgb(b);
  return A.map((v,i) => Math.round(v + (B[i]-v)*t)); };
const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function buildOrganism(spId, seed){
  const S = 1000;
  const {items, names} = BUILDERS[spId](mulberry32(seed || 1), S);
  return {items, names, S, sp:spId, sub:SP[spId].sub, nst:SP[spId].stages, seed};
}

/* -------------------------------------------------------------- painting */
function palette(subId, decay){
  const paper = cssVar('--card') || '#f4f7ef';
  const ink   = cssVar('--ink')  || '#1e2a21';
  const dk    = isDark();
  const base  = hueOf(subId);
  const grey  = dk ? '#5b6a5f' : '#a3afa4';
  const g = c => mixc(c, grey, decay);
  return {
    main: g(base),
    dark: g(mixc(base, ink, .42)),
    lite: g(mixc(base, paper, .58)),
    alt:  g(dk ? '#8a9aa6' : '#66747f'),
    altl: g(dk ? '#39434a' : '#dfe4e6'),
    cool: g(dk ? '#5f92d8' : '#3f74b8'),
    hot:  g(dk ? '#dd7a6a' : '#c05a45'),
    ink:  g(ink),
    paper:hex2rgb(paper),
  };
}

function drawOrganism(canvas, org, p, opt){
  opt = opt || {};
  const decay = opt.decay || 0;
  const solid = opt.alpha != null ? opt.alpha : 1;
  const hasGhost = opt.ghost != null && opt.ghost > p;
  const ghost = hasGhost ? opt.ghost : p;
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const box = canvas.getBoundingClientRect();
  const side = Math.round(Math.min(box.width, box.height));
  if (side < 24) return;
  if (canvas.width !== Math.round(side*dpr)) canvas.width = canvas.height = Math.round(side*dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, side, side);

  const s = side*0.98/org.S, ox = (side - org.S*s)/2, oy = (side - org.S*s)/2;
  const X = x => ox + x*s, Y = y => oy + y*s, L = v => v*s;
  const P = palette(org.sub, decay);
  const fade = (1 - decay*0.45)*solid;
  const drop = decay*decay*org.S*0.045;

  const stF = p*org.nst, stG = ghost*org.nst;
  const stage = Math.floor(stF), frac = stF - stage;

  /* per-stage item index, so a stage builds up piece by piece */
  const idxIn = {}, cntIn = {};
  org.items.forEach(it => { cntIn[it.st] = (cntIn[it.st] || 0) + 1; });

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  for (const it of org.items){
    const i = (idxIn[it.st] = (idxIn[it.st] || 0)), n = cntIn[it.st];
    idxIn[it.st]++;
    let g = 1, alpha = fade;
    if (it.st > stage){
      if (!hasGhost || it.st >= stG) continue;
      alpha = fade*0.16;                     /* only when a ghost was asked for */
    } else if (it.st === stage){
      const t0 = (i/n)*0.55;
      g = clamp((frac - t0)/0.45, 0, 1);
      if (g <= 0.001) continue;              /* this piece simply is not there yet */
    }

    const dy = drop*(1 + (it.st % 3)*0.4);
    const stroke = it.c === null ? null : P[it.c || 'dark'];
    const fill = it.f ? P[it.f] : null;
    const lw = Math.max(0.9, L(it.w != null ? it.w : 2.4));
    ctx.setLineDash(it.dash ? it.dash.map(v => L(v)) : []);

    const strokeIt = () => { if (!stroke || !it.w) return; ctx.strokeStyle = rgba(stroke, alpha); ctx.lineWidth = lw; ctx.stroke(); };
    const fillIt = () => { if (!fill) return; ctx.fillStyle = rgba(fill, alpha*(it.f === 'paper' ? 1 : 0.9)); ctx.fill(); };

    if (it.k === 'line'){
      ctx.beginPath();
      ctx.moveTo(X(it.x1), Y(it.y1) + dy);
      ctx.lineTo(X(it.x1 + (it.x2-it.x1)*g), Y(it.y1 + (it.y2-it.y1)*g) + dy);
      strokeIt();
    } else if (it.k === 'arrow'){
      const ax = it.x1 + (it.x2-it.x1)*g, ay = it.y1 + (it.y2-it.y1)*g;
      ctx.beginPath(); ctx.moveTo(X(it.x1), Y(it.y1) + dy); ctx.lineTo(X(ax), Y(ay) + dy); strokeIt();
      if (g > 0.6 && stroke){
        const a = Math.atan2(ay - it.y1, ax - it.x1), h = org.S*0.026;
        ctx.beginPath();
        ctx.moveTo(X(ax), Y(ay) + dy);
        ctx.lineTo(X(ax - Math.cos(a-0.42)*h), Y(ay - Math.sin(a-0.42)*h) + dy);
        ctx.lineTo(X(ax - Math.cos(a+0.42)*h), Y(ay - Math.sin(a+0.42)*h) + dy);
        ctx.closePath();
        ctx.fillStyle = rgba(stroke, alpha); ctx.fill();
      }
    } else if (it.k === 'path'){
      const n2 = Math.max(2, Math.round(it.pts.length*g));
      ctx.beginPath();
      it.pts.slice(0, n2).forEach(([x,y], j) => j ? ctx.lineTo(X(x), Y(y) + dy) : ctx.moveTo(X(x), Y(y) + dy));
      fillIt(); strokeIt();
    } else if (it.k === 'curve'){
      ctx.beginPath();
      ctx.moveTo(X(it.x1), Y(it.y1) + dy);
      ctx.quadraticCurveTo(X(it.cx), Y(it.cy) + dy,
        X(it.x1 + (it.x2-it.x1)*g), Y(it.y1 + (it.y2-it.y1)*g) + dy);
      strokeIt();
    } else if (it.k === 'rect'){
      const gw = it.rw*g, gh = it.rh*g;
      const x = it.x + (it.rw - gw)/2, y = it.y + (it.rh - gh)/2;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(X(x), Y(y) + dy, L(gw), L(gh), L(it.r != null ? it.r : 0));
      else ctx.rect(X(x), Y(y) + dy, L(gw), L(gh));
      fillIt(); strokeIt();
    } else if (it.k === 'poly'){
      const cx = it.pts.reduce((a,q) => a + q[0], 0)/it.pts.length;
      const cy = it.pts.reduce((a,q) => a + q[1], 0)/it.pts.length;
      ctx.beginPath();
      it.pts.forEach(([x,y], j) => {
        const px = cx + (x-cx)*g, py = cy + (y-cy)*g;
        j ? ctx.lineTo(X(px), Y(py) + dy) : ctx.moveTo(X(px), Y(py) + dy);
      });
      ctx.closePath();
      fillIt(); strokeIt();
    } else if (it.k === 'dot'){
      ctx.beginPath();
      ctx.arc(X(it.x), Y(it.y) + dy, Math.max(0.8, L(it.r*g)), 0, 6.2832);
      fillIt(); strokeIt();
    } else if (it.k === 'ell'){
      ctx.beginPath();
      ctx.ellipse(X(it.x), Y(it.y) + dy, Math.max(0.5, L(it.rx*g)), Math.max(0.5, L(it.ry*g)),
        it.rot || 0, 0, 6.2832);
      fillIt(); strokeIt();
    } else if (it.k === 'text'){
      const size = L(it.size || 24);
      if (size < 4.5) continue;
      ctx.save();
      ctx.translate(X(it.x), Y(it.y) + dy);
      if (it.rot) ctx.rotate(it.rot);
      ctx.font = `700 ${size}px Karla, ui-sans-serif, sans-serif`;
      ctx.textAlign = it.align || 'center';
      ctx.fillStyle = rgba(P[it.c || 'ink'], alpha*g);
      ctx.fillText(it.t, 0, 0);
      ctx.restore();
    }
  }
  ctx.setLineDash([]);
}

function stageInfo(spId, ms){
  const sp = SP[spId], per = stageMsOf(spId);
  const idx = clamp(Math.floor(ms/per), 0, sp.stages-1);
  const org = ORG_CACHE[spId] || (ORG_CACHE[spId] = buildOrganism(spId, 1));
  return {index:idx, name:org.names[idx] || '', total:sp.stages,
    next: org.names[Math.min(idx+1, sp.stages-1)] || ''};
}
const ORG_CACHE = {};

/* ================================================================== DIAL
   Continuous: 0 min at 12 o'clock, 120 min after a full turn, no snapping.
   ========================================================================= */
const R_DIAL = 126, C_DIAL = 150;
function polar(deg, r){
  const a = (deg - 90)*Math.PI/180;
  return [C_DIAL + Math.cos(a)*r, C_DIAL + Math.sin(a)*r];
}
function arcPath(deg){
  if (deg <= 0.4) return '';
  if (deg >= 359.6)
    return `M${C_DIAL} ${C_DIAL-R_DIAL} A${R_DIAL} ${R_DIAL} 0 1 1 ${C_DIAL-0.01} ${C_DIAL-R_DIAL}`;
  const [x1,y1] = polar(0, R_DIAL), [x2,y2] = polar(deg, R_DIAL);
  return `M${x1} ${y1} A${R_DIAL} ${R_DIAL} 0 ${deg > 180 ? 1 : 0} 1 ${x2} ${y2}`;
}
const minToDeg = m => m/MAX_MINUTES*360;

function paintDial(degOverride){
  const deg = degOverride != null ? degOverride : minToDeg(DB.prefs.minutes);
  $('#arc').setAttribute('d', arcPath(deg));
  const [hx,hy] = polar(deg, R_DIAL);
  $('#hOuter').setAttribute('cx', hx); $('#hOuter').setAttribute('cy', hy);
  $('#hInner').setAttribute('cx', hx); $('#hInner').setAttribute('cy', hy);
  setDialValue(Math.round(DB.prefs.minutes));
}

(function dialDrag(){
  const wrap = $('#dialwrap');
  let acc = 0, last = 0, dragging = false;
  const rel = e => {
    const r = wrap.getBoundingClientRect();
    return [e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2), r.width/2];
  };
  const angleAt = e => { const [dx,dy] = rel(e); return (Math.atan2(dy, dx)*180/Math.PI + 90 + 360) % 360; };
  const inRing = e => { const [dx,dy,R] = rel(e); const d = Math.hypot(dx, dy)/R; return d > 0.56 && d < 1.20; };
  wrap.addEventListener('pointerdown', e => {
    if (!DB.prefs.sp || !inRing(e)) return;
    dragging = true;
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    acc = minToDeg(DB.prefs.minutes);
    last = angleAt(e);
    e.preventDefault();
  });
  wrap.addEventListener('pointermove', e => {
    if (!dragging) return;
    const a = angleAt(e);
    let d = a - last;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    last = a;
    acc = clamp(acc + d, minToDeg(MIN_MINUTES), 360);
    const snapped = clamp(Math.round(acc/360*MAX_MINUTES/STEP_MINUTES)*STEP_MINUTES,
      MIN_MINUTES, MAX_MINUTES);
    const changed = snapped !== DB.prefs.minutes;
    DB.prefs.minutes = snapped;
    paintDial(acc);                          /* the ring tracks the finger, not the step */
    if (changed) paintPreview();
  });
  const end = () => { if (dragging){ dragging = false; paintDial(); save(); } };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
})();

/* =================================================================== HOME */
let previewOrg = null;

function applySubjectColor(subId){
  document.documentElement.style.setProperty('--sub',
    subId ? hueOf(subId) : (isDark() ? '#8b9a90' : '#6b7a70'));
}

function paintPreview(){
  const id = DB.prefs.sp;
  $('#coins').textContent = DB.coins;
  $('#pickCenter').hidden = !!id;
  $('#speciesBtn').hidden = !id;
  $('#plant').disabled = !id;
  $('#preview').style.visibility = id ? 'visible' : 'hidden';
  $('#dial').style.opacity = id ? '1' : '.3';
  if (!id){
    applySubjectColor(null);
    $('#growLine').textContent = 'Tap the middle to choose';
    $('#stageName').textContent = '';
    return;
  }
  const sp = SP[id], spec = specimen(id), gm = growthMs(id);
  applySubjectColor(sp.sub);
  $('#spCode').textContent = SUB[sp.sub].code;
  $('#spName').textContent = sp.name;
  if (!previewOrg || previewOrg.sp !== id || previewOrg.seed !== spec.seed)
    previewOrg = buildOrganism(id, spec.seed);
  /* home always shows at least the first part, so the ring is never blank */
  const target = clamp((spec.ms + DB.prefs.minutes*60000)/gm, 0, 1);
  drawOrganism($('#preview'), previewOrg, Math.max(target, 1/sp.stages), {});

  const st = stageInfo(id, spec.ms);
  const per = stageMsOf(id);
  const gained = Math.floor((spec.ms + DB.prefs.minutes*60000)/per) - Math.floor(spec.ms/per);
  $('#growLine').innerHTML = `<b>${fmtDur(spec.ms)}</b> / ${fmtDur(gm)} · stage <b>${st.index+1}</b>/${st.total}`;
  const plan = pomPlan(DB.prefs.minutes*60000);
  $('#stageName').innerHTML = (gained > 0
      ? `+${gained} part${gained > 1 ? 's' : ''} · next: ${st.next}`
      : `not enough for a new part`)
    + (DB.prefs.pomodoro && plan.breaks
        ? ` · <b>${plan.blocks}×25′</b> with ${plan.breaks} break${plan.breaks > 1 ? 's' : ''}`
        : '');
}

/* =============================================================== SESSION */
/* iOS cannot tell a locked screen from another app: both are just "hidden",
   and no API separates them. So it is a choice, not a detection:
     count — hidden time still counts (right when Guided Access is on, because
             then the only way to hide the page is the power button)
     pause — hidden time is not studied, the clock stops
     kill  — hidden longer than the grace period and the specimen dies       */
/* Past the planned time the session keeps running on its own — overtime —
   until Finish is tapped, the app is left, or the cap is reached. */
const capOf = a => Math.min(a.plannedMs + OVERTIME_MAX, SESSION_CAP);
/* A pomodoro break is time the app itself takes off the clock, so it is
   subtracted like a pause — and while it runs, being away costs nothing. */
function studiedOf(a, now){
  const brk = a.breakStart != null ? now - a.breakStart : 0;
  const live = brk ? 0 : (a.awayAt != null && DB.prefs.away !== 'count' ? now - a.awayAt : 0);
  return clamp(now - a.startAt - (a.pausedMs || 0) - (a.breakMs || 0) - brk - live, 0, capOf(a));
}
function breakLenFor(block){ return block % POM.every === 0 ? POM.long : POM.short; }
/* how a planned stretch is cut into blocks, for the home screen */
function pomPlan(ms){
  const blocks = Math.max(1, Math.ceil(ms/POM.block));
  return {blocks, breaks: blocks - 1};
}
function resolve(a, now, graceMs, mode){
  const cap = capOf(a);
  if (a.breakStart != null)                 /* on a break nothing can go wrong */
    return {kind:'break', until: a.breakStart + a.breakLen, studied: studiedOf(a, now)};
  if (a.awayAt != null && mode !== 'count'){
    const atAway = clamp(a.awayAt - a.startAt - (a.pausedMs || 0), 0, cap);
    /* already past the planned time: leaving just banks the overtime */
    if (atAway >= a.plannedMs) return {kind:'done', at: a.awayAt, studied: atAway};
    if (mode === 'kill' && now - a.awayAt >= graceMs)
      return {kind:'dead', at: a.awayAt + graceMs, studied: atAway};
    return {kind:'paused'};
  }
  const st = studiedOf(a, now);
  if (st >= cap) return {kind:'done', at: a.startAt + cap + (a.pausedMs || 0), studied: cap};
  return {kind:'running', studied: st, over: st >= a.plannedMs};
}

let ORG = null, rafId = 0;

function startSession(){
  if (!DB.prefs.sp) return;
  unlockAudio();
  const id = DB.prefs.sp, spec = specimen(id), now = Date.now();
  DB.active = {sp:id, subject:SP[id].sub, startAt:now, plannedMs:Math.round(DB.prefs.minutes)*60000,
    seed:spec.seed, baseMs:spec.ms, per:stageMsOf(id), awayAt:null, pausedMs:0, hiddenMs:0, seen:now,
    chimed:false, escapes:0,
    pom: !!DB.prefs.pomodoro, breakStart:null, breakLen:0, breakMs:0, blocksDone:0};
  save();
  ORG = buildOrganism(id, spec.seed);
  applySubjectColor(SP[id].sub);
  $('#sesCode').textContent = SUB[SP[id].sub].code;
  $('#sesName').textContent = SP[id].name;
  setOvertime(false); setBreak(false);
  show('session');
  requestWakeLock();
  loop();
}

function endSession(status, at, studied, awayMs){
  const a = DB.active;
  if (!a) return;
  const actual = Math.max(0, Math.round(studied));
  const gm = growthMs(a.sp), spec = specimen(a.sp);
  const ok = status === 'done';
  const out = {status, actual, coins: ok ? Math.round(actual/60000)*COIN_PER_MIN : 0,
    matured:false, deadAt:0, sp:a.sp, seed:a.seed, awayMs, baseMs:a.baseMs,
    gm, per: a.per || stageMsOf(a.sp),
    pausedMs:a.pausedMs || 0, hiddenMs:a.hiddenMs || 0,
    overMs: Math.max(0, Math.round(studied) - a.plannedMs)};

  if (ok){
    spec.ms += actual;
    DB.coins += out.coins;
    if (spec.ms >= gm){
      out.matured = true;
      DB.coins += MATURE_BONUS;
      out.coins += MATURE_BONUS;
      DB.grove.push({sp:a.sp, sub:a.subject, ms:gm, gm, at, seed:a.seed, dead:false});
      DB.growing[a.sp] = {ms: spec.ms - gm, seed:newSeed(), per:STAGE_MS};
    }
  } else if (status === 'abandoned'){
    /* giving up costs the session, not the specimen: the minutes are forfeited
       but what was already built stays exactly where it was */
    out.deadAt = spec.ms;
  } else {
    out.deadAt = spec.ms + actual;
    DB.grove.push({sp:a.sp, sub:a.subject, ms:out.deadAt, gm, at, seed:a.seed, dead:true});
    DB.growing[a.sp] = {ms:0, seed:newSeed(), per:STAGE_MS};
  }

  DB.sessions.push({id:a.startAt, subject:a.subject, sp:a.sp, startAt:a.startAt, endAt:at,
    plannedMs:a.plannedMs, actualMs:actual, pausedMs:a.pausedMs || 0,
    hiddenMs:a.hiddenMs || 0, status, coins:out.coins, escapes:a.escapes});
  DB.active = null;
  save();
  releaseWakeLock();
  stopLoop();
  previewOrg = null;
  showResult(out);
  if (SESSION) syncUp().catch(() => {});      /* fire and forget: offline is fine */
}

let tickId = 0, lastDrawP = -1, lastDrawA = -1, lastDrawAt = 0;
function loop(){
  stopLoop();
  const tick = () => {
    const a = DB.active;
    if (!a) return;
    const now = Date.now();
    const r = resolve(a, now, DB.prefs.grace*1000, DB.prefs.away);
    if (r.kind === 'dead'){ beep('dead'); endSession('escaped', r.at, r.studied, DB.prefs.grace*1000); return; }
    if (r.kind === 'done'){ beep('done'); endSession('done', r.at, r.studied, 0); return; }

    if (r.kind === 'break'){
      if (now >= r.until){                       /* break over, back to work */
        a.breakMs = (a.breakMs || 0) + a.breakLen;
        a.breakStart = null; a.breakLen = 0;
        beep('done'); save();
      } else {
        const left = r.until - now;
        setOvertime(false);
        setBreak(true);
        $('#clock').textContent = fmtClock(left);
        $('#sesArc').setAttribute('d', arcPath(clamp(1 - left/a.breakLen, 0, 1)*359.9));
        $('#sesState').innerHTML = `break · back to block <b>${a.blocksDone + 1}</b> in a moment`;
        if (now - (a.seen || 0) > 15000){ a.seen = now; save(); }
        return;
      }
    }
    setBreak(false);

    const studied = studiedOf(a, now), gm = growthMs(a.sp), cap = capOf(a);
    const over = studied >= a.plannedMs && cap > a.plannedMs;

    /* a whole block done and more work to come: take the break */
    if (a.pom && !over && studied < a.plannedMs){
      const blocks = Math.floor(studied/POM.block);
      if (blocks > (a.blocksDone || 0)){
        a.blocksDone = blocks;
        a.breakLen = breakLenFor(blocks);
        a.breakStart = now;
        beep('done'); save();
        return;
      }
    }
    if (over && !a.chimed){ a.chimed = true; beep('done'); save(); }
    setOvertime(over);
    $('#clock').textContent = over ? '+' + fmtClock(studied - a.plannedMs)
                                   : fmtClock(a.plannedMs - studied);
    $('#sesArc').setAttribute('d', arcPath(clamp(over
      ? (studied - a.plannedMs)/(cap - a.plannedMs)
      : studied/a.plannedMs, 0, 1)*359.9));
    const grown = a.baseMs + studied;
    const st = stageInfo(a.sp, Math.min(grown, gm - 1));
    $('#sesState').innerHTML = over
      ? `overtime · up to <b>+${fmtDur(cap - a.plannedMs)}</b>`
      : grown >= gm
      ? 'Complete · extra minutes go to the next one'
      : `stage ${st.index+1}/${st.total} · <b>${st.name}</b>` +
        (a.pausedMs > 30000 ? ` · ${fmtDur(a.pausedMs)} paused` : '');

    /* between one second and the next the drawing changes by an amount nobody
       can see, so it is repainted on a real change, not on every frame */
    const p = clamp(grown/gm, 0, 1);
    const alpha = 0.3 + 0.7*clamp(studied/a.plannedMs, 0, 1);
    if (Math.abs(p - lastDrawP) > 0.0012 || Math.abs(alpha - lastDrawA) > 0.02 || now - lastDrawAt > 8000){
      drawOrganism($('#organism'), ORG, p, {alpha});
      lastDrawP = p; lastDrawA = alpha; lastDrawAt = now;
    }
    if (now - (a.seen || 0) > 15000){ a.seen = now; save(); }  /* heartbeat: survives a hard kill */
  };
  lastDrawP = lastDrawA = -1; lastDrawAt = 0;
  tick();
  tickId = setInterval(tick, 1000);
}
function stopLoop(){
  clearInterval(tickId); tickId = 0;
  cancelAnimationFrame(rafId); rafId = 0;
}

function showResult(o){
  const sp = SP[o.sp], gm = o.gm || growthMs(o.sp);
  applySubjectColor(sp.sub);
  const org = buildOrganism(o.sp, o.seed);
  const ok = o.status === 'done';
  const kept = o.status === 'abandoned';      /* lost the session, kept the specimen */
  const pStart = clamp(o.baseMs/gm, 0, 1);
  const pEnd = clamp((o.baseMs + o.actual)/gm, 0, 1);
  const per = o.per || STAGE_MS;
  const partsGained = Math.floor((o.baseMs + o.actual)/per) - Math.floor(o.baseMs/per);

  $('#resTitle').textContent = o.matured ? sp.name + ' complete'
    : ok ? 'Session done'
    : kept ? 'Given up' : 'Dead';
  $('#resTitle').style.color = ok ? 'var(--ink)' : 'var(--bad)';
  $('#resSub').textContent = o.matured
    ? 'Fully built. It goes to the collection and a new one starts.'
    : ok ? (o.pausedMs > 30000 ? `Done, with ${fmtDur(o.pausedMs)} paused along the way.`
                                : 'You stayed here the whole time.')
    : kept ? 'You ended it yourself: these minutes do not count, but the specimen survives.'
    : `You were out of the app for more than ${DB.prefs.grace} seconds.`;
  $('#resGain').innerHTML =
    `<span class="pill">${fmtDur(o.actual)}</span>` +
    (o.overMs > 30000 ? `<span class="pill">+${fmtDur(o.overMs)} overtime</span>` : '') +
    (ok && partsGained ? `<span class="pill">+${partsGained} part${partsGained > 1 ? 's' : ''}</span>` : '') +
    (o.coins ? `<span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="var(--coin)"></circle></svg>+${o.coins}</span>` : '');
  $('#resBar').style.width = (ok ? pEnd*100 : kept ? pStart*100 : 0) + '%';
  $('#resNote').textContent = ok
    ? (o.matured ? 'Maturity bonus included.'
       : `${fmtDur(o.baseMs + o.actual)} of ${fmtDur(gm)} built.`)
    : kept
    ? `Still ${fmtDur(o.baseMs)} of ${fmtDur(gm)} built. The time stays in the stats, it just does not grow anything.`
    : `It had ${fmtDur(o.deadAt)} in it. The time stays in the stats, the specimen does not.`;

  /* the specimen starts drawing when the view lands, not while it is still away */
  go('result', () => {
    show('result');
    const t0 = performance.now();
    const anim = now => {
      const dt = now - t0;
      const decay = (ok || kept) ? 0 : clamp(dt/1800, 0, 1);
      const p = ok ? pStart + (pEnd - pStart)*clamp(dt/1400, 0, 1) : kept ? pStart : pEnd;
      drawOrganism($('#organism2'), org, p, {decay});
      if (ok ? dt < 1600 : kept ? false : decay < 1) rafId = requestAnimationFrame(anim);
    };
    rafId = requestAnimationFrame(anim);
  });
}

/* leaving the app: record the timestamp, never the event */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    /* iOS keeps a page alive in the background for as long as its audio session
       is live, and a live page keeps burning battery. Put it all to sleep. */
    stopLoop();
    releaseWakeLock();
    try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {}
    if (DB.active){ DB.active.awayAt = Date.now(); save(); }
    return;
  }
  try { if (AC && AC.state === 'suspended') AC.resume(); } catch (e) {}
  if (DB.active) handleReturn();
});
window.addEventListener('pagehide', () => {
  if (DB.active && DB.active.awayAt == null){ DB.active.awayAt = Date.now(); save(); }
});

function handleReturn(){
  const a = DB.active;
  if (!a || a.awayAt == null) return;
  const now = Date.now(), away = now - a.awayAt, mode = DB.prefs.away;
  const r = resolve(a, now, DB.prefs.grace*1000, mode);
  if (r.kind === 'dead'){ save(); beep('dead'); endSession('escaped', r.at, r.studied, away); return; }

  a.hiddenMs = (a.hiddenMs || 0) + away;
  if (mode === 'pause' && a.breakStart == null) a.pausedMs = (a.pausedMs || 0) + away;
  a.awayAt = null;
  a.seen = now;

  const after = resolve(a, now, DB.prefs.grace*1000, mode);
  if (after.kind === 'done'){ save(); beep('done'); endSession('done', after.at, after.studied, away); return; }
  if (mode === 'pause' && away > 2000) flash(`Paused ${fmtDur(away)} · not counted`, true);
  save(); requestWakeLock(); loop();
}

let flashTimer = 0;
function flash(msg, neutral){
  const el = $('#flash');
  if (neutral) el.style.background = 'var(--ink-3)';
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.classList.remove('on'); el.style.background = ''; }, 4000);
}
function flashOk(msg){ $('#flash').style.background = 'var(--sub)'; flash(msg); }

/* ------------------------------------------------------- audio & screen */
let AC = null;
function unlockAudio(){
  if (!DB.prefs.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended' && !document.hidden) AC.resume();
  } catch (e) {}
}
function beep(kind){
  if (!AC || !DB.prefs.sound) return;
  try {
    const t = AC.currentTime, notes = kind === 'done' ? [523.25, 659.25, 783.99] : [196, 138.59];
    notes.forEach((f,i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === 'done' ? 'sine' : 'triangle';
      o.frequency.value = f;
      const t0 = t + i*(kind === 'done' ? .16 : .34);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(kind === 'done' ? .22 : .3, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + (kind === 'done' ? .5 : 1.1));
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0 + 1.2);
    });
  } catch (e) {}
}
let wakeLock = null;
async function requestWakeLock(){
  try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseWakeLock(){ try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

/* ================================================================== MOTION */
/* A tap is a step, and a step takes time: the view on screen fades out, the
   work happens while nothing is visible, the next one fades in. Two numbers
   set the whole pace. Someone who asked iOS for less motion gets none of it. */
const CALM = matchMedia('(prefers-reduced-motion: reduce)');
const outMs = () => CALM.matches ? 0 : 130;
const inMs  = () => CALM.matches ? 0 : 260;

let moving = false, moveA = 0, moveB = 0;

/* leave the current view, run `work` (by default just switch), arrive */
function go(v, work){
  const from = $('#v-' + currentView);
  clearTimeout(moveA); clearTimeout(moveB);
  document.querySelectorAll('.view').forEach(x => x.classList.remove('leaving','entering'));
  moving = true;
  from.classList.add('leaving');
  moveA = setTimeout(() => {
    from.classList.remove('leaving');
    (work || (() => show(v)))();
    const to = $('#v-' + currentView);
    to.classList.add('entering');
    moveB = setTimeout(() => { to.classList.remove('entering'); moving = false; }, inMs());
  }, outMs());
}

/* the same move inside one view: the block leaves, is rebuilt, comes back.
   `dir` slides it sideways instead — +1 goes forward, -1 back. */
function swap(el, work, dir){
  if (!el) return work();
  dir = dir || 0;
  el.style.setProperty('--mx', (dir ? -dir*14 : 0) + 'px');
  el.style.setProperty('--my', dir ? '0px' : '-4px');
  el.style.setProperty('--nx', (dir ? dir*16 : 0) + 'px');
  el.style.setProperty('--ny', dir ? '0px' : '7px');
  clearTimeout(el._mvA); clearTimeout(el._mvB);
  el.classList.remove('entering');
  el.classList.add('leaving');
  el._mvA = setTimeout(() => {
    el.classList.remove('leaving');
    work();
    el.classList.add('entering');
    el._mvB = setTimeout(() => el.classList.remove('entering'), inMs());
  }, outMs());
}

/* a value that changed in place, so the eye catches it */
function bump(el){
  if (!el) return;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

/* a tap that leads somewhere: the button holds its press until the view goes */
function tap(el, fn){
  if (!el) return;
  el.onclick = e => {
    if (moving) return;
    el.classList.add('held');
    setTimeout(() => el.classList.remove('held'), outMs() + 90);
    fn(e);
  };
}

  const locked = v === 'session' || v === 'result';

    : v === 'rank' ? 'Ranking' : 'EPFL Focus';

/* hold to give up: leaving has to cost a gesture */
let inBreak = false;
function setBreak(on){
  if (on === inBreak) return;
  inBreak = on;
  $('#sesWrap').classList.toggle('paused', on);
  $('#abandon').classList.toggle('finish', on);
  $('#abandonLabel').textContent = on ? 'Skip the break' : 'Hold to give up';
}
let inOvertime = false;
function setOvertime(on){
  if (on === inOvertime) return;
  inOvertime = on;
  $('#sesWrap').classList.toggle('over', on);
  $('#abandon').classList.toggle('finish', on);
  $('#abandonLabel').textContent = on ? 'Finish and keep the time' : 'Hold to give up';
}
(function(){
  const btn = $('#abandon'), fill = $('#holdFill');
  let start = 0, id = 0;
  const stop = () => { cancelAnimationFrame(id); fill.style.width = '0%'; start = 0; };
  const tick = () => {
    const p = clamp((performance.now() - start)/1400, 0, 1);
    fill.style.width = (p*100) + '%';
    if (p >= 1){ const n = Date.now(); stop(); endSession('abandoned', n, studiedOf(DB.active, n), 0); return; }
    id = requestAnimationFrame(tick);
  };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (inBreak){                          /* cut the break short and get back to it */
      const a = DB.active, n = Date.now();
      a.breakMs = (a.breakMs || 0) + (n - a.breakStart);
      a.breakStart = null; a.breakLen = 0;
      save(); setBreak(false); loop();
      return;
    }
    if (inOvertime){                       /* the work is already done: one tap banks it */
      const n = Date.now();
      endSession('done', n, studiedOf(DB.active, n), 0);
      return;
    }
    start = performance.now(); tick();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => btn.addEventListener(ev, stop));
})();

function openSpecies(){
  let html = `<h2>What you are building</h2>
    <p class="sub">One minute of study, one coin. A specimen gains a new named part every
    ${fmtDur(STAGE_MS)}; the bigger ones have more parts and take longer.</p>`;
  SUBJECTS.forEach(sub => {
    html += `<div class="subjhead"><span class="dotc" style="background:${hueOf(sub.id)}"></span>${sub.code} · ${sub.name}</div><div class="spgrid">`;
    SPECIES.filter(s => s.sub === sub.id).forEach(s => {
      const un = isUnlocked(s.id), cant = !un && DB.coins < s.cost;
      html += `<button class="sp ${un ? '' : 'locked'} ${cant ? 'cant' : ''}" data-id="${s.id}"
        aria-pressed="${String(DB.prefs.sp === s.id)}">
        <canvas data-sp="${s.id}" data-seed="7" data-p="1"></canvas>
        <div class="n">${s.name}</div>
        <div class="t">${s.stages} parts · ${fmtDur(s.growth*60000)}</div>
        ${un ? '' : `<div class="cost"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"></circle></svg>${s.cost}</div>`}
      </button>`;
    });
    html += `</div>`;
  });

      closeSheet(); previewOrg = null; paintDial(); paintPreview();
      flashOk(`${s.name} unlocked`);

      flash(`${s.cost - DB.coins} coins short`);

  }));

/* =================================================================== STATS */
let scope = 'day', anchor = new Date();

/* midnight on the Monday of that date — built from calendar fields, never
   from a subtraction, so the two DST weekends stay whole */
function weekStart(x){
  const d = new Date(x.getFullYear(), x.getMonth(), x.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

function periodRange(){
  const d = anchor;
  if (scope === 'day'){
    const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return [a.getTime(), addDays(a, 1).getTime()];
  }
  if (scope === 'week'){
    const a = weekStart(d);
    return [a.getTime(), addDays(a, 7).getTime()];
  }
  if (scope === 'month')
    return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(),
            new Date(d.getFullYear(), d.getMonth()+1, 1).getTime()];
  return [new Date(d.getFullYear(), 0, 1).getTime(), new Date(d.getFullYear()+1, 0, 1).getTime()];
}
function periodLabel(){
  const d = anchor, n = new Date();
  if (scope === 'day'){
    if (dayKey(d.getTime()) === dayKey(n.getTime())) return 'Today';
    if (dayKey(d.getTime()) === dayKey(n.getTime() - 86400000)) return 'Yesterday';
    return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
  }
  if (scope === 'week'){
    const a = weekStart(d), b = addDays(a, 6);
    const back = Math.round((weekStart(n).getTime() - a.getTime())/86400000);
    if (back === 0) return 'This week';
    if (back === 7) return 'Last week';
    return `${a.getDate()} ${MON3[a.getMonth()]} – ${b.getDate()} ${MON3[b.getMonth()]}`;
  }
  if (scope === 'month') return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  return String(d.getFullYear());
}
function shift(dir){
  const d = new Date(anchor);
  if (scope === 'day') d.setDate(d.getDate() + dir);
  else if (scope === 'week') d.setDate(d.getDate() + dir*7);
  else if (scope === 'month') d.setMonth(d.getMonth() + dir);
  else d.setFullYear(d.getFullYear() + dir);
  anchor = d;
  renderStats();
}
function isFuture(){
  const d = anchor, n = new Date();
  if (scope === 'day') return dayKey(d.getTime()) >= dayKey(n.getTime());
  if (scope === 'week') return weekStart(d).getTime() >= weekStart(n).getTime();
  if (scope === 'month') return d.getFullYear() > n.getFullYear() ||
    (d.getFullYear() === n.getFullYear() && d.getMonth() >= n.getMonth());
  return d.getFullYear() >= n.getFullYear();
}
function streakDays(){
  const done = new Set(DB.sessions.filter(s => s.status === 'done').map(s => dayKey(s.startAt)));
  let n = 0;
  const d = new Date();
  if (!done.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
  while (done.has(dayKey(d.getTime()))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

function barChart(values, labels, axis, title, opt){
  opt = opt || {};
  const peak = Math.max(...values);
  const max = Math.max(1, opt.max || peak), maxIdx = values.indexOf(peak);
  const bars = values.map((v,i) =>
    `<button data-i="${i}" aria-pressed="false" aria-label="${labels[i]}: ${fmtDur(v)}"><i class="${v ? '' : 'zero'}" style="height:${v ? Math.max(4, Math.min(1, v/max)*100) : 0}%"></i></button>`).join('');
  const init = peak > 0
    ? `<span>Best · ${labels[maxIdx]}</span><b>${fmtDur(values[maxIdx])}</b>`
    : `<span>No sessions</span><b>0m</b>`;
  return `<div class="chart">
    <div class="cap"><span class="t">${title}</span><span class="m">${opt.scale || 'peak ' + fmtDur(max)}</span></div>
    <div class="bars" id="bars">${bars}</div>
    <div class="axis">${axis.map(a => `<span>${a}</span>`).join('')}</div>
    <div class="readbox" id="readbox">${init}</div></div>`;
}
function bindBars(values, labels){
  const bars = $('#bars');
  if (!bars) return;
  bars.querySelectorAll('button').forEach(b => b.onclick = () => {
    bars.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    const i = +b.dataset.i;
    $('#readbox').innerHTML = `<span>${labels[i]}</span><b>${fmtDur(values[i])}</b>`;
    bump($('#readbox'));
  });
}
/* Minutes per hour of the day. A session is spread over the wall clock it
   actually spans, so the studied time lands in the hours it happened in;
   pauses and breaks stretch that span, which is why it is a share and not
   a straight copy of actualMs. */
function hourValues(list){
  const v = Array(24).fill(0);
  list.forEach(s => {
    const span = Math.max(60000, (s.endAt || s.startAt + s.actualMs) - s.startAt);
    const rate = s.actualMs/span;
    let t = s.startAt;
    const end = s.startAt + span;
    while (t < end){
      const d = new Date(t);
      const next = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours()+1).getTime();
      const chunk = Math.min(end, next) - t;
      v[d.getHours()] += chunk*rate;
      t += chunk;
    }
  });
  return v.map(x => Math.min(x, 3600000));
}
function subjectSplit(list){
  const by = {};
  list.forEach(s => { by[s.subject] = (by[s.subject] || 0) + s.actualMs; });
  const rows = SUBJECTS.filter(s => by[s.id]).sort((a,b) => by[b.id] - by[a.id]);
  if (!rows.length) return '';
  const max = Math.max(...rows.map(s => by[s.id]));
  return `<div class="split"><h3>By course</h3>` + rows.map(s => `
    <div class="srow"><span class="dotc" style="background:${hueOf(s.id)}"></span>
      <span class="code">${s.code}</span>
      <span class="track2"><i style="width:${by[s.id]/max*100}%;background:${hueOf(s.id)}"></i></span>
      <span class="v">${fmtDur(by[s.id])}</span></div>`).join('') + `</div>`;
}

function renderStats(){
  $('#periodLabel').textContent = periodLabel();
  $('#next').disabled = isFuture();
  document.querySelectorAll('#scope button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.scope === scope)));
  applySubjectColor(null);

  const [from, to] = periodRange();
  const list = DB.sessions.filter(s => s.startAt >= from && s.startAt < to).sort((a,b) => a.startAt - b.startAt);
  const total = list.reduce((n,s) => n + s.actualMs, 0);
  const done = list.filter(s => s.status === 'done').length;
  const lost = list.length - done;

  let html = `<div class="hero"><span class="v">${fmtDur(total)}</span><span class="u">studied</span></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${done}</div><div class="k">completed</div></div>
      <div class="kpi ${lost ? 'bad' : ''}"><div class="v">${lost}</div><div class="k">lost</div></div>
      <div class="kpi"><div class="v">${streakDays()}</div><div class="k">day streak</div></div>
    </div>`;

  let values = null, labels = null;
  if (scope === 'day'){
    if (list.length){
      values = hourValues(list);
      labels = values.map((_,h) => `${pad2(h)}:00 – ${pad2((h+1)%24)}:00`);
      html += barChart(values, labels, ['00:00','06:00','12:00','18:00','24:00'],
        'Time per hour', {max:3600000, scale:'full bar = 1h'});
    }
    html += subjectSplit(list) + `<div class="slist"><h3>Sessions</h3>`;
    if (!list.length) html += `<div class="empty">Nothing yet.</div>`;
    else list.forEach(s => {
      const ko = s.status !== 'done';
      html += `<div class="sess ${ko ? 'ko' : ''}">
        <span class="when">${new Date(s.startAt).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})}</span>
        <span class="dotc" style="background:${hueOf(s.subject)}"></span>
        <span class="code">${SUB[s.subject].code}</span>
        ${ko ? `<span class="tag">${s.status === 'escaped' ? 'escaped' : 'gave up'}</span>` : ''}
        <span class="len">${fmtDur(s.actualMs)}</span></div>`;
    });
    html += `</div>`;
  } else if (scope === 'week'){
    const a = weekStart(anchor);
    values = Array(7).fill(0);
    labels = DAY3.map((n,i) => `${n} ${addDays(a, i).getDate()}`);
    list.forEach(s => { values[(new Date(s.startAt).getDay() + 6) % 7] += s.actualMs; });
    html += barChart(values, labels, ['Mon','Thu','Sun'], 'Time per day') + subjectSplit(list);
  } else if (scope === 'month'){
    const y = anchor.getFullYear(), m = anchor.getMonth(), days = new Date(y, m+1, 0).getDate();
    values = Array(days).fill(0);
    labels = Array.from({length:days}, (_,i) => `${MON3[m]} ${i+1}`);
    list.forEach(s => { values[new Date(s.startAt).getDate()-1] += s.actualMs; });
    html += barChart(values, labels, ['1', String(Math.ceil(days/2)), String(days)], 'Time per day') + subjectSplit(list);
  } else {
    values = Array(12).fill(0);
    labels = MONTHS.slice();
    list.forEach(s => { values[new Date(s.startAt).getMonth()] += s.actualMs; });
    html += barChart(values, labels, ['Jan','Jun','Dec'], 'Time per month') + subjectSplit(list);
  }

  const allTime = DB.sessions.reduce((n,s) => n + s.actualMs, 0);
  const grown = DB.grove.filter(g => !g.dead).length;
  html += `<div class="foot">${fmtDur(allTime)} in total · ${DB.sessions.length} sessions · ${grown} completed specimens</div>`;
  $('#statsBody').innerHTML = html;
  if (values) bindBars(values, labels);
}
document.querySelectorAll('#scope button').forEach(b => tap(b, () => {
  if (b.getAttribute('aria-selected') === 'true') return;
  scope = b.dataset.scope; anchor = new Date();
  swap($('#statsBody'), () => { renderStats(); bump($('#periodLabel')); });
}));
/* the period slides the way you are going: back goes right, forward goes left */
const step = dir => swap($('#statsBody'), () => { shift(dir); bump($('#periodLabel')); }, dir);
tap($('#prev'), () => step(-1));
tap($('#next'), () => step(1));

/* ============================================================== COLLECTION */
/* Grouped by species, not by month: the question the collection answers is
   "how much of this have I actually grown". The same reading works on the
   losses — dead time is quoted as the fraction of a specimen it would have
   been worth, which is the only honest way to feel it. */
function renderGrove(){
  applySubjectColor(null);
  const rowOf = new Map();
  const row = id => {
    if (!rowOf.has(id)) rowOf.set(id, {id, ok:0, okMs:0, lost:0, lostMs:0, lostWorth:0, live:0, seed:7, at:0});
    return rowOf.get(id);
  };
  DB.grove.filter(g => SP[g.sp]).forEach(g => {
    const r = row(g.sp);
    if (g.dead){ r.lost++; r.lostMs += g.ms; r.lostWorth += g.ms/graveGrowth(g); }
    else { r.ok++; r.okMs += g.ms; if (g.at >= r.at){ r.at = g.at; r.seed = g.seed; } }
  });
  for (const id of Object.keys(DB.growing || {}))
    if (SP[id] && DB.growing[id].ms > 0){ const r = row(id); r.live = DB.growing[id].ms; }

  const rows = [...rowOf.values()].sort((a,b) => (b.okMs + b.lostMs + b.live) - (a.okMs + a.lostMs + a.live));
  if (!rows.length){
    $('#groveBody').innerHTML = `<div class="empty">The collection is empty.<br>
      A specimen lands here when every part is built —<br>or when it dies, and then the gap shows.</div>`;
    return;
  }
  const sum = k => rows.reduce((n,r) => n + r[k], 0);
  const okN = sum('ok'), lostN = sum('lost'), lostMs = sum('lostMs');

  let html = `<div class="kpis two">
      <div class="kpi"><div class="v">${okN}</div><div class="k">grown · ${fmtDur(sum('okMs'))}</div></div>
      <div class="kpi ${lostN ? 'bad' : ''}"><div class="v">${lostN}</div><div class="k">lost · ${fmtDur(lostMs)}</div></div>
    </div>
    <div class="gsec">${rows.length} specimen${rows.length > 1 ? 's' : ''}</div>`;

  rows.forEach(r => {
    const sp = SP[r.id];
    const worth = n => (Math.round(n*10)/10).toFixed(1).replace(/\.0$/, '');
    html += `<button class="spcard ${r.ok ? '' : 'gone'}" data-id="${r.id}">
      <canvas data-sp="${r.id}" data-seed="${r.seed}" data-p="1"
        data-dead="${r.ok ? 0 : 1}"></canvas>
      <span class="body">
        <span class="n">${sp.name}</span>
        <span class="c"><i class="dotc" style="background:${hueOf(sp.sub)}"></i>${SUB[sp.sub].code}
          · ${sp.stages} parts · ${fmtDur(growthMs(r.id))} each</span>
        <span class="figs">
          <span class="fig"><b>×${r.ok}</b> · ${fmtDur(r.okMs)}</span>
          ${r.lost ? `<span class="fig bad"><b>${fmtDur(r.lostMs)}</b> lost · ${worth(r.lostWorth)}×</span>` : ''}
          ${r.live ? `<span class="fig">growing · ${fmtDur(r.live)}</span>` : ''}
        </span>
      </span></button>`;
  });
  html += `<div class="foot">One named part every ${fmtDur(STAGE_MS)} of study.
    ${lostN ? `The multiplier reads lost time as the specimen it would have finished:
      ${worth0(rows)} thrown away.` : 'Nothing lost so far.'}</div>`;

  $('#groveBody').innerHTML = html;
  paintMinis($('#groveBody'));
  $('#groveBody').querySelectorAll('.spcard').forEach(b =>
    tap(b, () => openSpecimens(b.dataset.id)));
}
/* lost time across species has no single growth time: quote it in whole
   specimens of the species it was actually lost on */
function worth0(rows){
  const n = rows.reduce((t,r) => t + r.lostWorth, 0);
  return (Math.round(n*10)/10) + ' specimen' + (Math.round(n*10)/10 === 1 ? '' : 's');
}

function openSpecimens(id){
  const sp = SP[id], gm = growthMs(id);
  const perLive = stageMsOf(id);
  const list = DB.grove.filter(g => g.sp === id).sort((a,b) => b.at - a.at);
  const live = DB.growing[id] && DB.growing[id].ms > 0 ? DB.growing[id] : null;
  let html = `<h2>${sp.name}</h2>
    <p class="sub">${SUB[sp.sub].code} · one new part every ${fmtDur(perLive)},
      ${sp.stages} parts and ${fmtDur(gm)} to finish one.</p>`;
  if (live){
    const st = stageInfo(id, live.ms);
    html += `<div class="readbox"><span>Growing now · stage ${st.index+1}/${sp.stages} · ${st.name}</span>
      <b>${fmtDur(live.ms)}</b></div>`;
  }
  html += list.length
    ? `<div class="grid" style="margin-top:16px">` + list.map(g => `
        <div class="spec ${g.dead ? 'dead' : ''}">
          <canvas data-sp="${g.sp}" data-seed="${g.seed}" data-dead="${g.dead ? 1 : 0}"
            data-p="${g.dead ? clamp(g.ms/graveGrowth(g), .12, 1) : 1}"></canvas>
          <div class="n">${new Date(g.at).toLocaleDateString('en-GB', {day:'numeric', month:'short'})}${
            g.dead ? ' · ' + fmtDur(g.ms) : ''}</div>
        </div>`).join('') + `</div>`
    : `<div class="empty">Nothing finished yet — the first one lands here at ${fmtDur(gm)}.</div>`;
  openSheet(html);
  paintMinis($('#sheetBody'));
}

function saveSession(v){
  SESSION = v;
  try { v ? localStorage.setItem(SESSION_KEY, JSON.stringify(v)) : localStorage.removeItem(SESSION_KEY); } catch (e) {}
}
function mkSession(d){
  const meta = (d.user && d.user.user_metadata) || {};
  const had = SESSION || {};
  return {access_token:d.access_token, refresh_token:d.refresh_token || had.refresh_token,
          expires_at: Date.now() + (d.expires_in || 3600)*1000,
          user_id: (d.user && d.user.id) || had.user_id,
          email: (d.user && d.user.email) || had.email,
          name: meta.name || had.name || ''};
}

/* Every request goes through here, so the token is renewed here: an access
   token lasts an hour and the app sits idle for far longer than that. */
async function sb(path, opt){
  opt = opt || {};
  const authed = opt.auth !== false && !!SESSION;
  if (authed && !(await freshSession()))
    throw Object.assign(new Error('your session expired — sign in again'), {status:401});
  try { return await sbRaw(path, opt); }
  catch (e) {
    if (!authed || !expiredErr(e) || !(await freshSession(true))) throw e;
    return await sbRaw(path, opt);          /* the clock was off: one retry */
  }
}
const expiredErr = e => e.status === 401 || e.code === 'PGRST301' ||
  /jwt expired|invalid jwt|token is expired/i.test(e.message || '');

async function sbRaw(path, opt){
  const h = Object.assign({apikey:SB_KEY, 'Content-Type':'application/json'}, opt.headers || {});
  if (opt.auth !== false && SESSION) h.Authorization = 'Bearer ' + SESSION.access_token;
  const res = await fetch(SB_URL + path, {
    method: opt.method || 'GET', headers: h,
    body: opt.body != null ? JSON.stringify(opt.body) : undefined,
  });
  const txt = await res.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
  if (!res.ok){
    const msg = (data && (data.msg || data.message || data.error_description)) || ('HTTP ' + res.status);
    throw Object.assign(new Error(msg), {code: data && (data.error_code || data.code), status: res.status});
  }
  return data;
}

/* One refresh at a time: several calls can find the token stale together. */
let refreshing = null;
function freshSession(force){
  if (!SESSION) return Promise.resolve(false);
  if (!force && SESSION.expires_at && Date.now() < SESSION.expires_at - 120000)
    return Promise.resolve(true);
  if (!SESSION.refresh_token){ saveSession(null); return Promise.resolve(false); }
  if (!refreshing) refreshing = (async () => {
    try {
      saveSession(mkSession(await sbRaw('/auth/v1/token?grant_type=refresh_token',
        {method:'POST', auth:false, body:{refresh_token:SESSION.refresh_token}})));
      return true;
    } catch (e) {
      if (e.status >= 400 && e.status < 500) saveSession(null);   /* token really is dead */
      return false;
    } finally { refreshing = null; }
  })();
  return refreshing;
}

async function ensureProfile(){
  if (!SESSION) return;
  await sb('/rest/v1/profiles', {method:'POST',
    headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
    body:[{id:SESSION.user_id, name:(SESSION.name || 'anon').slice(0,24)}]});
}

function dayTotals(){
  const by = {};
  DB.sessions.forEach(s => {
    const k = dayKey(s.startAt);
    const r = by[k] || (by[k] = {minutes:0, completed:0, lost:0});
    r.minutes += Math.round(s.actualMs/60000);
    if (s.status === 'done') r.completed++; else r.lost++;
  });
  return by;
}

/* push only the days whose totals changed since last time */
async function syncUp(){
  if (!SESSION || !(await freshSession())) return false;
  const agg = dayTotals();
  DB.pushed = DB.pushed || {};
  const rows = [];
  for (const day of Object.keys(agg)){
    const r = agg[day], sig = r.minutes + '/' + r.completed + '/' + r.lost;
    if (DB.pushed[day] === sig) continue;
    rows.push({user_id:SESSION.user_id, day, minutes:Math.min(1440, r.minutes),
               completed:r.completed, lost:r.lost, _sig:sig});
  }
  if (!rows.length){ await pushBackup(); return true; }
  await sb('/rest/v1/days', {method:'POST',
    headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
    body: rows.map(({_sig, ...r}) => r)});
  rows.forEach(r => { DB.pushed[r.day] = r._sig; });
  DB.syncedAt = Date.now();
  save();
  await pushBackup();
  return true;
}

/* The account is the backup: the phone can be wiped, replaced or have its
   storage evicted, and the history comes back on the next sign-in. */
function backupPayload(){
  const out = {};
  for (const k of Object.keys(DB)) if (k !== 'board') out[k] = DB[k];
  out.active = null;
  return out;
}
async function pushBackup(){
  if (!SESSION) return;
  try {
    await sb('/rest/v1/backups', {method:'POST',
      headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
      body:[{user_id:SESSION.user_id, data:backupPayload(),
             sessions:DB.sessions.length, updated_at:new Date().toISOString()}]});
  } catch (e) { /* table not created yet, or offline: the app carries on */ }
}
async function restoreIfBehind(){
  if (!SESSION) return false;
  let row = null;
  try {
    const rows = await sb('/rest/v1/backups?select=data,sessions&user_id=eq.' + SESSION.user_id);
    row = rows && rows[0];
  } catch (e) { return false; }
  if (!row || !row.data) return false;
  const remote = row.data, rn = (remote.sessions || []).length;
  if (rn <= DB.sessions.length) return false;
  const keepSp = DB.prefs && DB.prefs.sp;
  DB = Object.assign(blank(), remote);
  DB.prefs = Object.assign(blank().prefs, DB.prefs || {});
  if (keepSp && SP[keepSp]) DB.prefs.sp = keepSp;
  DB.active = null;
  knownSessions = DB.sessions.length;
  save(true);
  previewOrg = null;
  flashOk(`Restored ${rn} sessions from your account`);
  return true;
}

const RANK_PERIODS = {
  today: {label:'Today',  from:() => dayKey(Date.now())},
  week:  {label:'Week',   from:() => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dayKey(d.getTime()); }},
  all:   {label:'All time', from:() => '2000-01-01'},
};
let rankPeriod = 'week', rankBusy = false, authMode = 'in';

async function loadBoard(){
  if (!(await freshSession())) return null;
  const rows = await sb('/rest/v1/rpc/leaderboard', {method:'POST',
    body:{p_from: RANK_PERIODS[rankPeriod].from(), p_to: dayKey(Date.now())}});
  DB.board = DB.board || {};
  DB.board[rankPeriod] = {at:Date.now(), rows};
  save();
  return rows;
}

function renderRank(){
  applySubjectColor(null);
  const box = $('#rankBody');

  if (!SESSION){
    const isUp = authMode === 'up';
    box.innerHTML = `<div class="auth">
      <h3>${isUp ? 'Create an account' : 'Sign in'}</h3>
      <p>${isUp
        ? 'Your name and a password, nothing else — no email, no confirmation. Your daily minutes join a shared board; everything else stays on this phone.'
        : 'The same name and password you signed up with. Works on any device.'}</p>
      <div class="field"><label for="au-first">First name</label>
        <input id="au-first" type="text" autocomplete="given-name" maxlength="20" placeholder="Luigi"></div>
      <div class="field"><label for="au-last">Last name</label>
        <input id="au-last" type="text" autocomplete="family-name" maxlength="20" placeholder="Colella"></div>
      <div class="field"><label for="au-pass">Password</label>
        <input id="au-pass" type="password" autocomplete="${isUp ? 'new-password' : 'current-password'}" placeholder="at least 6 characters"></div>
      <button class="authbtn" id="au-go">${isUp ? 'Create account' : 'Sign in'}</button>
      <div class="authswap">${isUp ? 'Already have one?' : 'No account yet?'}
        <button id="au-swap">${isUp ? 'Sign in' : 'Create one'}</button></div>
      <div id="au-msg"></div>
    </div>`;
    tap($('#au-swap'), () => { authMode = isUp ? 'in' : 'up'; swap(box, renderRank); });
    $('#au-go').onclick = () => doAuth(isUp);
    box.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => {
      if (e.key === 'Enter') doAuth(isUp);
    }));
    return;
  }

  const cached = (DB.board && DB.board[rankPeriod]) || null;
  const rows = cached ? cached.rows : [];
  const max = Math.max(1, ...rows.map(r => r.minutes));
  const me = (SESSION.name || '').toLowerCase();
  box.innerHTML = `
    <div class="whoami">
      <div class="n">${SESSION.name || SESSION.email}<small>${SESSION.email}</small></div>
      <button class="mini" id="rk-out">Sign out</button>
    </div>
    <div class="scope" id="rk-scope">${Object.keys(RANK_PERIODS).map(k =>
      `<button data-p="${k}" aria-selected="${k === rankPeriod}">${RANK_PERIODS[k].label}</button>`).join('')}</div>
    ${rows.length ? rows.map((r, i) => `
      <div class="lbrow ${r.name.toLowerCase() === me ? 'me' : ''}">
        <span class="pos">${i+1}</span>
        <span class="lbcell"><span class="nm">${r.name}</span>
          <span class="lbbar"><i style="width:${r.minutes/max*100}%"></i></span></span>
        <span class="mn">${fmtDur(r.minutes*60000)}</span>
      </div>`).join('')
      : `<div class="empty">${rankBusy ? 'Loading…' : 'Nobody has studied in this period yet.'}</div>`}
    <div class="synced" id="rk-sync">${cached
      ? 'updated ' + new Date(cached.at).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})
      : 'not loaded yet'}</div>`;
  tap($('#rk-out'), () => { saveSession(null); swap(box, renderRank); });
  box.querySelectorAll('#rk-scope button').forEach(b => tap(b, () => {
    if (b.getAttribute('aria-selected') === 'true') return;
    rankPeriod = b.dataset.p;
    swap(box, () => { renderRank(); refreshRank(); });
  }));
}

async function refreshRank(){
  if (!SESSION || rankBusy) return;
  rankBusy = true;
  const note = $('#rk-sync');
  if (note) note.textContent = 'updating…';
  try {
    await ensureProfile();
    if (await restoreIfBehind()) renderStats();
    await syncUp();
    await loadBoard();
    if (currentView === 'rank') renderRank();
  } catch (e) {
    rankBusy = false;
    if (currentView !== 'rank') return;
    if (!SESSION){ renderRank(); return; }        /* signed out mid-flight */
    const n = $('#rk-sync');
    if (n) n.textContent = navigator.onLine ? 'could not update: ' + e.message : 'offline — showing the last list';
  } finally { rankBusy = false; }
}

async function doAuth(isUp){
  const btn = $('#au-go'), msg = $('#au-msg');
  const first = tidy($('#au-first').value), last = tidy($('#au-last').value);
  const pass = $('#au-pass').value || '';
  const fail = t => { msg.className = 'authmsg err'; msg.textContent = t; };
  if (slug(first).length < 2) return fail('Type your first name.');
  if (slug(last).length < 2) return fail('Type your last name.');
  const name = (first + ' ' + last).slice(0, 24);
  const email = addressFor(first, last);
  if (pass.length < 6) return fail('The password needs at least 6 characters.');

  btn.disabled = true;
  msg.className = ''; msg.textContent = '';
  try {
    if (isUp){
      const d = await sb('/auth/v1/signup', {method:'POST', auth:false,
        body:{email, password:pass, data:{name}}});
      if (!d || !d.access_token){
        msg.className = 'authmsg err';
        msg.textContent = 'The account exists but the project is still waiting for a mail confirmation it can never receive. Turn off "Confirm email" in Supabase, then sign in.';
        authMode = 'in';
        return;
      }
      saveSession(mkSession(d));
    } else {
      saveSession(mkSession(await sb('/auth/v1/token?grant_type=password',
        {method:'POST', auth:false, body:{email, password:pass}})));
    }
    renderRank();
    refreshRank();
    return;
  } catch (e) {
    fail(e.code === 'email_not_confirmed'
         ? 'This project still requires a mail confirmation. Turn off "Confirm email" in Supabase.'
       : e.code === 'invalid_credentials' ? 'No account with that name, or the password is wrong.'
       : e.code === 'user_already_exists' || /already/i.test(e.message)
         ? 'Someone already signed up with that exact name. Add a middle name, or sign in if it was you.'
       : e.code === 'over_email_send_rate_limit' || /rate limit/i.test(e.message)
         ? 'Supabase is still trying to send confirmation mails. Turn off "Confirm email" in the project and try again.'
       : e.code === 'weak_password' ? 'That password is too weak.'
       : navigator.onLine ? e.message : 'No connection.');
  } finally { btn.disabled = false; }
}

/* ==================================================================== BOOT */
(function initTheme(){
  const t = localStorage.getItem('epflfocus.theme');
  if (t) document.documentElement.dataset.theme = t;
  syncStatusBar();
})();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  syncStatusBar();
  previewOrg = null;
  if (currentView === 'home') paintPreview();
  else if (currentView === 'grove') renderGrove();
});

document.querySelectorAll('#nav button').forEach(b =>
  b.onclick = () => { if (!DB.active) show(b.dataset.view); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchend', unlockAudio, {once:true, passive:true});
new ResizeObserver(() => {
  if (currentView === 'home') paintPreview();
  else if (currentView === 'session') lastDrawP = -1;   /* let the next tick repaint at the new size */
}).observe($('#app'));

/* labels are drawn on canvas, so wait for the webfont before the first paint */
if (document.fonts && document.fonts.ready)
  document.fonts.ready.then(() => { if (currentView === 'home') paintPreview(); else if (currentView === 'grove') renderGrove(); });

paintDial();
if (DB.active && SP[DB.active.sp]){
  const now = Date.now(), a = DB.active;
  a.pausedMs = a.pausedMs || 0;
  /* cold restart: everything since the last heartbeat was time off the app */
  if (a.awayAt == null) a.awayAt = a.seen || now;
  const r = resolve(a, now, DB.prefs.grace*1000, DB.prefs.away);
  applySubjectColor(a.subject);
  $('#sesCode').textContent = SUB[a.subject].code;
  $('#sesName').textContent = SP[a.sp].name;
  if (r.kind === 'dead') endSession('escaped', r.at, r.studied, now - a.awayAt);
  else {
    const gap = now - a.awayAt;
    a.hiddenMs = (a.hiddenMs || 0) + gap;
    if (DB.prefs.away === 'pause' && a.breakStart == null) a.pausedMs = (a.pausedMs || 0) + gap;
    a.awayAt = null; a.seen = now;
    const after = resolve(a, now, DB.prefs.grace*1000, DB.prefs.away);
    if (after.kind === 'done'){ save(); endSession('done', after.at, after.studied, gap); }
    else {
      save();
      ORG = buildOrganism(a.sp, a.seed);
      show('session'); requestWakeLock(); loop();
    }
  }
} else {
  DB.active = null;
  show('home');
}

if ('serviceWorker' in navigator){
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading || DB.active) return;      /* never yank the page mid-session */
    reloading = true;
    location.reload();
  });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
